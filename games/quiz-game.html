<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1c2;--card:#fff;--ink:#3d2f00;--muted:#85702b;--accent:#ff9f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#221b05;--card:#352a0a;--ink:#fbf1cc;--muted:#c9b46b;--accent:#ffb347}}
:root[data-theme="dark"]{--bg:#221b05;--card:#352a0a;--ink:#fbf1cc;--muted:#c9b46b;--accent:#ffb347}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.05rem}
.q{background:var(--card);border-radius:18px;padding:26px 16px;text-align:center;font-size:1.6rem;font-weight:700;line-height:1.25;min-height:130px;display:flex;align-items:center;justify-content:center}
#fb{text-align:center;font-weight:600;font-size:1.15rem;min-height:1.6em}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#opts button{border:0;border-radius:16px;color:#fff;font:700 1.25rem/1.2 Fredoka,sans-serif;padding:14px 8px;min-height:84px;cursor:pointer}
#opts button:nth-child(1){background:#e0483f}
#opts button:nth-child(2){background:#2f80ed}
#opts button:nth-child(3){background:#2a9d62}
#opts button:nth-child(4){background:#8e5be8}
#opts button.ok{background:#1f9d4d;outline:4px solid #b9f0cc}
#opts button.no{opacity:.35;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#3d2f00;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.6rem;margin:0;letter-spacing:.3rem}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#85702b;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}#opts button.no{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">❓💡🌍</p><h2>Welcome</h2><p class="sub">Let’s play the Quiz Game</p></div></div>
<main>
<h1>Quiz Game</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span id="prog"></span><span id="sc"></span></div>
<div class="q" id="q"></div>
<div id="fb" aria-live="polite"></div>
<div id="opts"></div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const Q={
easy:[
['What color is the sky on a sunny day?','Blue','Green','Red','Pink'],
['Which animal says “moo”?','Cow','Dog','Cat','Duck'],
['How many legs does a dog have?','4','2','6','8'],
['Which fruit is long and yellow?','Banana','Cherry','Plum','Blueberry'],
['What do bees make?','Honey','Milk','Bread','Juice'],
['Which shape has 3 sides?','Triangle','Circle','Square','Star'],
['What do we use to see?','Eyes','Ears','Nose','Hands'],
['Which animal has a long trunk?','Elephant','Lion','Rabbit','Monkey'],
['What do you wear on your feet?','Shoes','Hat','Gloves','Scarf'],
['How many days are in a week?','7','5','10','12'],
['What do plants need to grow?','Sunlight and water','Candy and toys','Plastic','Sand only']],
medium:[
['What is the capital of Nigeria?','Abuja','Lagos','Kano','Ibadan'],
['Which planet do we live on?','Earth','Mars','Venus','Jupiter'],
['How many continents are there?','7','5','6','8'],
['Which gas do we breathe in to live?','Oxygen','Carbon dioxide','Helium','Nitrogen'],
['What is the largest ocean?','Pacific Ocean','Atlantic Ocean','Indian Ocean','Arctic Ocean'],
['What is frozen water called?','Ice','Steam','Fog','Dew'],
['Which is the largest land animal?','Elephant','Giraffe','Hippo','Rhino'],
['How many minutes are in an hour?','60','50','100','30'],
['What is at the center of our solar system?','The Sun','The Moon','Earth','Mars'],
['Which of these is a mammal?','Whale','Shark','Frog','Eagle'],
['What do caterpillars turn into?','Butterflies','Beetles','Bees','Birds']],
hard:[
['What is the largest planet in our solar system?','Jupiter','Saturn','Earth','Neptune'],
['What is the chemical formula for water?','H₂O','CO₂','O₂','NaCl'],
['Which is the longest river in Africa?','Nile','Niger','Congo','Zambezi'],
['What is the hardest natural substance?','Diamond','Gold','Iron','Quartz'],
['How many bones does an adult human have?','206','106','306','150'],
['Which organ pumps blood around the body?','Heart','Lungs','Liver','Kidney'],
['In which year did Nigeria become independent?','1960','1957','1963','1980'],
['What is the square root of 144?','12','14','11','16'],
['Which force pulls things toward the Earth?','Gravity','Magnetism','Friction','Wind'],
['Which planet is called the Red Planet?','Mars','Venus','Mercury','Saturn'],
['What do we call how plants make food from sunlight?','Photosynthesis','Digestion','Evaporation','Respiration']]};
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let level='easy',pool,i,score,cur,tried,locked;
function ui(){
$('#prog').textContent='Question '+(i+1);
$('#sc').textContent='⭐ '+score}
function next(){
if(!pool.length)pool=shuffle(Q[level]);
const[q,ans,...w]=pool.pop();
cur={ans};tried=false;locked=false;
$('#q').textContent=q;
$('#fb').textContent='';
const o=$('#opts');
o.innerHTML='';
shuffle([ans,...w]).forEach(v=>{
const b=document.createElement('button');
b.textContent=v;
b.onclick=()=>pick(b,v);
o.append(b)});
ui()}
function pick(b,v){
if(locked)return;
if(v===cur.ans){
locked=true;GA.sfx('good');
b.classList.add('ok');
if(!tried)score++;
$('#fb').textContent=['Great job! 🎉','Awesome! ⭐','You got it! 👏'][Math.random()*3|0];
i++;ui();
setTimeout(next,1000)}
else{
tried=true;GA.sfx('bad');
b.disabled=true;
b.classList.add('no');
$('#fb').textContent='Oops, try again! 💪'}}
function start(){
pool=[];i=0;score=0;
next()}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
start()});
start();
GA.init({"root": 261.63, "scale": [0, 2, 4, 7, 9], "wave": "square", "bpm": 128, "gain": 0.05, "pat": "0 0 2 4 2 0 4 _ 3 3 4 5 4 3 2 _"});
</script>
</body>
</html>
