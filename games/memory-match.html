<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Match</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9f1;--card:#fff;--ink:#4a1f3a;--muted:#8a5c77;--accent:#ff6f9c;--back:#7c4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1020;--card:#2e1b33;--ink:#f8e6f1;--muted:#c49ab5;--accent:#ff8fb3;--back:#8f6bff}}
:root[data-theme="dark"]{--bg:#1d1020;--card:#2e1b33;--ink:#f8e6f1;--muted:#c49ab5;--accent:#ff8fb3;--back:#8f6bff}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.05rem}
#fb{text-align:center;font-weight:600;font-size:1.15rem;min-height:1.6em}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1;border:0;border-radius:14px;background:var(--back);color:#fff;font:700 clamp(2rem,12vw,3rem)/1 Fredoka,sans-serif;cursor:pointer;padding:0}
.card::before{content:'?'}
.card.up{background:var(--card);color:#000;transform:scale(1.04)}
.card.up::before{content:none}
.card.ok{background:#c8f3d6;outline:3px solid #2fa86a}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#4a1f3a;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.6rem;margin:0;letter-spacing:.3rem}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#8a5c77;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🐶🐱🐼</p><h2>Welcome</h2><p class="sub">Let’s play Memory Match</p></div></div>
<main>
<h1>Memory Match</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span id="mv"></span><span id="st"></span></div>
<div id="fb" aria-live="polite"></div>
<div id="board"></div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const E=['🐶','🐱','🐼','🦁','🐸','🐵','🐰','🦊','🐯','🐨'];
const pairs={easy:4,medium:6,hard:8};
let level='easy',first,lock,moves,found,total,stars=0;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function ui(){
$('#mv').textContent='Moves: '+moves;
$('#st').textContent='⭐ '+stars}
function deal(){
total=pairs[level];
const set=shuffle(E).slice(0,total);
moves=0;found=0;first=null;lock=false;
$('#fb').textContent='Find the matching pairs!';
const b=$('#board');
b.innerHTML='';
shuffle([...set,...set]).forEach(e=>{
const c=document.createElement('button');
c.className='card';
c.dataset.e=e;
c.setAttribute('aria-label','Hidden card');
c.onclick=()=>flip(c);
b.append(c)});
ui()}
function flip(c){
if(lock||c===first||c.classList.contains('up'))return;
c.classList.add('up');GA.sfx('tick');
c.textContent=c.dataset.e;
c.setAttribute('aria-label',c.dataset.e);
if(!first){first=c;return}
moves++;ui();
if(first.dataset.e===c.dataset.e){
first.classList.add('ok');
c.classList.add('ok');
first=null;found++;GA.sfx('good');
if(found===total){
stars++;ui();lock=true;GA.sfx('win');
$('#fb').textContent='You found them all! 🎉';
setTimeout(deal,2200)}
else $('#fb').textContent=['Great job! 🎉','Nice match! ⭐','You got it! 👏'][moves%3]}
else{
lock=true;GA.sfx('bad');
const a=first;
first=null;
setTimeout(()=>{
[a,c].forEach(x=>{x.classList.remove('up');x.textContent='';x.setAttribute('aria-label','Hidden card')});
lock=false},800)}}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
stars=0;
deal()});
deal();
GA.init({"root": 523.25, "scale": [0, 2, 4, 7, 9], "wave": "sine", "bpm": 92, "gain": 0.09, "pat": "0 2 1 3 2 4 3 2 0 _ 1 _ 2 _ 0 _"});
</script>
</body>
</html>
