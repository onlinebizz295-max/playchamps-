<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e8ff;--card:#fff;--ink:#1b1d4a;--muted:#5d609a;--accent:#6c5ce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b1f;--card:#17173a;--ink:#e8e9ff;--muted:#9d9fd6;--accent:#8c7dff}}
:root[data-theme="dark"]{--bg:#0b0b1f;--card:#17173a;--ink:#e8e9ff;--muted:#9d9fd6;--accent:#8c7dff}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:14px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
h1{font-size:2.1rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:9px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.05rem}
#fb{text-align:center;font-weight:600;min-height:1.4em;font-size:.95rem}
.stage{position:relative}
canvas{width:100%;aspect-ratio:360/460;display:block;border-radius:16px;background:#0b0b2e;touch-action:none}
#joy{position:absolute;left:12px;bottom:12px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55);touch-action:none;user-select:none;-webkit-user-select:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.88);border:3px solid #6c5ce7;pointer-events:none}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#1b1d4a;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#5d609a;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🚀👾</p><h2>Welcome</h2><p class="sub">Let’s play Space Arcade</p></div></div>
<main>
<h1>Space Arcade</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span id="lv">Level 1</span><span id="hp"></span><span id="sc">⭐ 0</span></div>
<div id="fb" aria-live="polite">Tap the screen, then use the joystick</div>
<div class="stage">
<canvas id="c" width="360" height="460"></canvas>
<div id="joy" aria-label="Joystick"><div id="knob"></div></div>
</div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d'),W=360,H=460;
const LV={easy:{hp:3,fire:2,eb:150,dodge:.2,sp:60,boss:30},medium:{hp:4,fire:1.5,eb:190,dodge:.4,sp:85,boss:45},hard:{hp:6,fire:1.05,eb:230,dodge:.6,sp:110,boss:65}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const COLS=['#ff5d8f','#4cd964','#ffcc00','#5ac8fa','#ff8a3d'];
let level='easy',state='ready',score=0,best=0,lives=3,kills=0,ship,bullets,eb,enemy,parts,fireT,spawnT,inv,banner=0,bid=0,last=0,overAt=0;
const stars=[...Array(50)].map(()=>({x:R(0,W),y:R(0,H),v:R(20,90),s:R(1,2.2)}));
const pj={x:0,y:0},kb={x:0,y:0};
try{best=+localStorage.getItem('spaceBest')||0}catch(e){}
const isBoss=()=>(kills+1)%5===0;
function ui(){
$('#lv').textContent=isBoss()?'Boss level!':'Level '+(kills+1);
$('#hp').textContent='❤'.repeat(lives)+'♡'.repeat(3-lives);
$('#sc').textContent='⭐ '+score}
function reset(){
score=0;lives=3;kills=0;
ship={x:W/2,y:H-90};
bullets=[];eb=[];parts=[];enemy=null;
fireT=0;spawnT=.6;inv=0;banner=0;state='ready';
$('#fb').textContent='Tap the screen, then use the joystick';
ui()}
function start(){
if(state==='over'&&performance.now()-overAt>600)reset();
if(state==='ready'){
state='play';
$('#fb').textContent='Your rocket fires by itself. Shoot the ships! 🚀'}}
function spawn(){
const c=LV[level],boss=isBoss(),sc=1+Math.floor(kills/5)*.2;
enemy={boss,x:W/2,y:-70,ty:boss?95:RI(60,120),w:boss?58:30,hp:Math.ceil((boss?c.boss:c.hp)*sc),vx:c.sp*(boss?.7:1)*(Math.random()<.5?-1:1),fireT:R(.7,1.3),dodgeT:0,dv:0,seen:new Set(),col:COLS[kills%5],flash:0};
enemy.max=enemy.hp;
if(boss){banner=2;$('#fb').textContent='BOSS incoming! 👾'}
else $('#fb').textContent='Enemy ship!';
ui()}
function boom(x,y,n,col){
for(let i=0;i<n;i++){const a=R(0,6.3),v=R(40,200);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(.4,.9),col:i%2?col:'#ffd166'})}}
function hurt(){
if(inv>0)return;
lives--;inv=1.6;eb=[];
boom(ship.x,ship.y,18,'#ff5d5d');
GA.sfx('hit');
ui();
if(lives<=0){
state='over';overAt=performance.now();
GA.sfx('lose');
if(score>best){
best=score;
try{localStorage.setItem('spaceBest',best)}catch(e){}}
$('#fb').textContent='Oops! Score '+score+' (best '+best+'). Tap to try again 💪'}
else $('#fb').textContent='Ouch! '+lives+' '+(lives===1?'life':'lives')+' left'}
function kill(){
const e=enemy;
boom(e.x,e.y,e.boss?40:22,e.col);
score+=e.boss?1000:100;
kills++;
if(e.boss&&lives<3)lives++;
GA.sfx(e.boss?'win':'good');
$('#fb').textContent=e.boss?'Boss defeated! 🎉':'Nice shot! Another ship is coming…';
enemy=null;spawnT=1.2;eb=[];
ui()}
function updEnemy(dt){
const e=enemy,c=LV[level];
if(e.flash>0)e.flash-=dt;
if(e.y<e.ty)e.y+=130*dt;
else{
e.x+=e.vx*dt;
if(e.x<e.w||e.x>W-e.w){e.vx=-e.vx;e.x=clamp(e.x,e.w,W-e.w)}
if(e.dodgeT>0){e.dodgeT-=dt;e.x=clamp(e.x+e.dv*dt,e.w,W-e.w)}
if(!e.boss)bullets.forEach(b=>{
if(e.seen.has(b.id)||b.y<e.y||b.y-e.y>170||Math.abs(b.x-e.x)>e.w+6)return;
e.seen.add(b.id);
if(Math.random()<c.dodge){e.dodgeT=.3;e.dv=(b.x<e.x?1:-1)*280}});
e.fireT-=dt;
if(e.fireT<=0){
e.fireT=c.fire*R(.8,1.2)*(e.boss?.8:1);
const sp=c.eb;
if(e.boss)[-.35,0,.35].forEach(a=>eb.push({x:e.x,y:e.y+e.w*.7,vx:Math.sin(a)*sp,vy:Math.cos(a)*sp}));
else{
const dx=ship.x-e.x,dy=ship.y-e.y,l=Math.hypot(dx,dy)||1,ax=level==='easy'?0:dx/l*.5*sp;
eb.push({x:e.x,y:e.y+e.w*.6,vx:ax,vy:Math.sqrt(sp*sp-ax*ax)})}}}}
function update(dt){
const ix=pj.x||kb.x,iy=pj.y||kb.y;
ship.x=clamp(ship.x+ix*210*dt,22,W-22);
ship.y=clamp(ship.y+iy*210*dt,H*.35,H-34);
if(inv>0)inv-=dt;
if(banner>0)banner-=dt;
fireT-=dt;
if(fireT<=0){bullets.push({x:ship.x,y:ship.y-30,id:++bid});fireT=.3}
bullets.forEach(b=>b.y-=520*dt);
bullets=bullets.filter(b=>b.y>-20);
if(!enemy){spawnT-=dt;if(spawnT<=0)spawn()}
else updEnemy(dt);
eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
eb=eb.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20);
if(enemy&&enemy.y>0){
const e=enemy;
bullets=bullets.filter(b=>{
if(Math.abs(b.x-e.x)<e.w&&Math.abs(b.y-e.y)<e.w*.7){
e.hp--;e.flash=.1;
boom(b.x,b.y,3,'#7df9ff');
GA.sfx('tick');
return false}
return true});
if(e.hp<=0)kill();
else if(Math.abs(ship.x-e.x)<e.w*.8&&Math.abs(ship.y-e.y)<e.w*.7)hurt()}
if(state==='play'&&eb.some(b=>Math.hypot(b.x-ship.x,b.y-ship.y)<15))hurt();
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
parts=parts.filter(p=>p.life>0)}
function drawShip(){
if(inv>0&&Math.floor(inv*12)%2)return;
g.save();g.translate(ship.x,ship.y);
g.fillStyle='#ff5d5d';
g.beginPath();g.moveTo(-10,6);g.lineTo(-24,24);g.lineTo(-10,18);g.closePath();g.fill();
g.beginPath();g.moveTo(10,6);g.lineTo(24,24);g.lineTo(10,18);g.closePath();g.fill();
g.fillStyle='#f2f2f7';
g.beginPath();g.moveTo(0,-30);g.lineTo(11,-8);g.lineTo(11,18);g.lineTo(-11,18);g.lineTo(-11,-8);g.closePath();g.fill();
g.fillStyle='#ff5d5d';
g.beginPath();g.moveTo(0,-30);g.lineTo(11,-8);g.lineTo(-11,-8);g.closePath();g.fill();
g.fillStyle='#5ac8fa';g.beginPath();g.arc(0,3,5,0,7);g.fill();
g.fillStyle='#ffcc00';
const f=8+Math.random()*10;
g.beginPath();g.moveTo(-6,18);g.lineTo(0,24+f);g.lineTo(6,18);g.closePath();g.fill();
g.restore()}
function drawEnemy(){
const e=enemy;
g.save();g.translate(e.x,e.y);
if(e.flash>0)g.globalAlpha=.55;
if(e.boss){
g.fillStyle='#4527a0';g.beginPath();g.ellipse(0,0,e.w,e.w*.62,0,0,7);g.fill();
g.fillStyle='#7c4dff';g.beginPath();g.ellipse(0,-4,e.w*.86,e.w*.5,0,0,7);g.fill();
[-18,18].forEach(dx=>{
g.fillStyle='#fff';g.beginPath();g.arc(dx,-6,10,0,7);g.fill();
g.fillStyle='#111';g.beginPath();g.arc(dx,-3,5,0,7);g.fill();
g.strokeStyle='#111';g.lineWidth=4;g.beginPath();g.moveTo(dx-11,-20+(dx<0?0:6));g.lineTo(dx+11,-14-(dx<0?0:6));g.stroke()});
g.fillStyle='#fff';
for(let i=-3;i<=3;i++)g.fillRect(i*8-3,12,6,8);
g.fillStyle='#ffcc00';
[-40,40].forEach(dx=>g.fillRect(dx-5,20,10,14))}
else{
g.fillStyle=e.col;g.beginPath();g.ellipse(0,4,e.w,e.w*.42,0,0,7);g.fill();
g.fillStyle='#bfefff';g.beginPath();g.ellipse(0,-2,e.w*.5,e.w*.45,0,Math.PI,0);g.fill();
g.fillStyle='rgba(255,255,255,.85)';
[-16,0,16].forEach(dx=>{g.beginPath();g.arc(dx,7,3,0,7);g.fill()})}
g.restore();
g.globalAlpha=1;
const bw=e.w*2;
g.fillStyle='rgba(255,255,255,.28)';g.fillRect(e.x-bw/2,e.y-e.w*.85-12,bw,6);
g.fillStyle=e.boss?'#ff5d8f':'#4cd964';g.fillRect(e.x-bw/2,e.y-e.w*.85-12,bw*Math.max(0,e.hp)/e.max,6)}
function draw(){
const bg=g.createLinearGradient(0,0,0,H);
bg.addColorStop(0,'#0b0b2e');bg.addColorStop(1,'#23206b');
g.fillStyle=bg;g.fillRect(0,0,W,H);
stars.forEach(s=>{g.fillStyle='rgba(255,255,255,'+(.35+s.s/4)+')';g.fillRect(s.x,s.y,s.s,s.s)});
g.fillStyle='#7df9ff';
bullets.forEach(b=>g.fillRect(b.x-2,b.y-8,4,16));
eb.forEach(b=>{
g.fillStyle='rgba(255,107,107,.35)';g.beginPath();g.arc(b.x,b.y,9,0,7);g.fill();
g.fillStyle='#ff6b6b';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill();
g.fillStyle='#ffd1d1';g.beginPath();g.arc(b.x,b.y,2,0,7);g.fill()});
if(enemy)drawEnemy();
if(state!=='over')drawShip();
parts.forEach(p=>{g.globalAlpha=Math.min(1,p.life*1.6);g.fillStyle=p.col;g.fillRect(p.x-2,p.y-2,4,4)});
g.globalAlpha=1;
g.textAlign='center';g.lineJoin='round';
function label(t,y,sz,col){
g.font='700 '+sz+'px Fredoka,Arial,sans-serif';
g.strokeStyle='#0b0b2e';g.lineWidth=7;g.strokeText(t,W/2,y);
g.fillStyle=col;g.fillText(t,W/2,y)}
if(banner>0&&state==='play'){g.globalAlpha=Math.min(1,banner);label('BOSS LEVEL!',H/2-60,38,'#ff5d8f');g.globalAlpha=1}
if(state==='ready'){label('TAP TO START',H/2-30,32,'#fff');label('🚀',H/2+20,44,'#fff')}
if(state==='over'){label('GAME OVER',H/2-30,38,'#ff5d8f');label('Score: '+score,H/2+14,26,'#fff');label('Tap to try again',H/2+50,22,'#7df9ff')}}
function frame(ts){
const dt=Math.min((ts-last)/1000,.05);
last=ts;
stars.forEach(s=>{s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=R(0,W)}});
if(state==='play')update(dt);
draw();
requestAnimationFrame(frame)}
const J=$('#joy'),K=$('#knob'),JR=38;
function stick(e){
const r=J.getBoundingClientRect();
let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
const d=Math.hypot(dx,dy),k=Math.min(d,JR)/(d||1);
dx*=k;dy*=k;
K.style.transform='translate('+dx+'px,'+dy+'px)';
const m=Math.hypot(dx,dy)/JR;
pj.x=m<.12?0:dx/JR;
pj.y=m<.12?0:dy/JR}
function release(){
pj.x=pj.y=0;
K.style.transform=''}
J.addEventListener('pointerdown',e=>{J.setPointerCapture(e.pointerId);start();stick(e)});
J.addEventListener('pointermove',e=>{if(J.hasPointerCapture(e.pointerId))stick(e)});
J.addEventListener('pointerup',release);
J.addEventListener('pointercancel',release);
cv.addEventListener('pointerdown',start);
const KEYS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]},held=new Set();
function kbSync(){
let x=0,y=0;
held.forEach(k=>{x+=KEYS[k][0];y+=KEYS[k][1]});
const l=Math.hypot(x,y)||1;
kb.x=x/l;kb.y=y/l}
addEventListener('keydown',e=>{
if(!KEYS[e.key])return;
e.preventDefault();start();held.add(e.key);kbSync()});
addEventListener('keyup',e=>{held.delete(e.key);kbSync()});
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
reset()});
reset();
requestAnimationFrame(frame);
GA.init({"root": 196, "scale": [0, 3, 5, 7, 10], "wave": "sawtooth", "bpm": 140, "gain": 0.045, "pat": "0 0 3 0 5 3 0 _ 7 5 3 5 3 0 3 _"});
</script>
</body>
</html>
