<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balloon Pop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e3f1ff;--card:#fff;--ink:#16324f;--muted:#5b7894;--accent:#ff5d8f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b2b;--card:#182b42;--ink:#e6f1fc;--muted:#93aac3;--accent:#ff7fa6}}
:root[data-theme="dark"]{--bg:#0e1b2b;--card:#182b42;--ink:#e6f1fc;--muted:#93aac3;--accent:#ff7fa6}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem}
#q{background:var(--card);border-radius:16px;padding:14px;text-align:center;font-size:1.5rem;font-weight:700}
#fb{text-align:center;font-weight:600;min-height:1.5em}
#sky{position:relative;height:min(55vh,420px);border-radius:18px;overflow:hidden;background:linear-gradient(#8fd3ff,#e9f7ff)}
.b{position:absolute;bottom:-110px;width:66px;height:80px;border:0;border-radius:50% 50% 46% 46%;background:var(--c);color:#fff;font:700 1.5rem Fredoka,sans-serif;cursor:pointer;padding:0;touch-action:manipulation;animation:rise var(--t) linear var(--d) 1 both}
.b::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-6px;border:6px solid transparent;border-top:10px solid var(--c);border-bottom:0}
.b.burst{background:none;font-size:2.6rem}
.b.burst::after{display:none}
.b.no{opacity:.35}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-1*var(--h)))}}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#16324f;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#5b7894;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🎈🎈🎈</p><h2>Welcome</h2><p class="sub">Let’s play Balloon Pop</p></div></div>
<main>
<h1>Balloon Pop</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span>Tap the right balloon</span><span id="sc">⭐ 0</span></div>
<div id="q"></div>
<div id="fb" aria-live="polite"></div>
<div id="sky"></div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a+1)|0;
const sky=$('#sky');
const dur={easy:9,medium:7,hard:5.5};
const COLORS=['#e63946','#2f80ed','#2fa86a','#8e5be8','#ff8a3d','#e0409a'];
let level='easy',score=0,q,busy=false;
function setH(){sky.style.setProperty('--h',sky.clientHeight+140+'px')}
function distract(){
let v;
do v=q.ans+R(-5,5);while(v===q.ans||v<1);
return v}
function launch(b,correct,delay){
b.dataset.c=correct?'1':'';
b.className='b';
b.textContent=correct?q.ans:distract();
b.style.left=R(2,78)+'%';
b.style.setProperty('--c',COLORS[R(0,5)]);
b.style.setProperty('--t',dur[level]+Math.random()*2+'s');
b.style.setProperty('--d',delay+'s');
b.style.animation='none';
void b.offsetWidth;
b.style.animation=''}
function newQ(){
if(level==='easy'){const a=R(1,10);q={t:'Pop the number '+a,ans:a}}
else if(level==='medium'){
const a=R(2,12),b=R(1,9);
q=Math.random()<.5?{t:'Pop the answer: '+a+' + '+b,ans:a+b}:{t:'Pop the answer: '+(a+b)+' − '+b,ans:a}}
else{const a=R(2,12),b=R(2,9);q={t:'Pop the answer: '+a+' × '+b,ans:a*b}}
$('#q').textContent=q.t;
$('#fb').textContent='';
sky.innerHTML='';
setH();
for(let k=0;k<7;k++){
const b=document.createElement('button');
b.addEventListener('pointerdown',()=>hit(b));
b.addEventListener('animationend',e=>{if(e.animationName==='rise'&&!busy)launch(b,b.dataset.c==='1',0)});
sky.append(b);
launch(b,k===0,-Math.random()*dur[level])}
busy=false}
function hit(b){
if(busy)return;
if(b.dataset.c==='1'){
busy=true;score++;GA.sfx('pop');
$('#sc').textContent='⭐ '+score;
b.classList.add('burst');
b.textContent='💥';
$('#fb').textContent=['Pop! 🎉','Great job! ⭐','You got it! 👏'][R(0,2)];
setTimeout(newQ,700)}
else{
b.classList.add('no');GA.sfx('bad');
$('#fb').textContent='Oops, try another! 💪';
setTimeout(()=>b.classList.remove('no'),400)}}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
score=0;busy=false;
$('#sc').textContent='⭐ 0';
newQ()});
addEventListener('resize',setH);
newQ();
GA.init({"root": 392, "scale": [0, 2, 4, 7, 9], "wave": "sine", "bpm": 104, "gain": 0.1, "pat": "4 2 0 2 4 5 4 _ 5 4 2 4 2 0 _ _"});
</script>
</body>
</html>
