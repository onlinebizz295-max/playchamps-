<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Slice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9ec;--card:#fff;--ink:#4a1020;--muted:#9a5a68;--accent:#ff5d73;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25090f;--card:#3a1620;--ink:#ffe9ec;--muted:#d6a3ae;--accent:#ff7a8d}}
:root[data-theme="dark"]{--bg:#25090f;--card:#3a1620;--ink:#ffe9ec;--muted:#d6a3ae;--accent:#ff7a8d}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:14px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
h1{font-size:2.1rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:9px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.05rem}
#fb{text-align:center;font-weight:600;min-height:1.4em;font-size:.95rem}
canvas{width:100%;max-width:calc(62vh * .6923);aspect-ratio:360/520;display:block;margin:0 auto;border-radius:16px;touch-action:none;background:#233a60;cursor:crosshair}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#4a1020;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#9a5a68;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🍉🍊🍓</p><h2>Welcome</h2><p class="sub">Let’s play Fruit Slice</p></div></div>
<main>
<h1>Fruit Slice</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span id="hp"></span><span id="sc">⭐ 0</span><span id="bs">Best: 0</span></div>
<div id="fb" aria-live="polite">Swipe your finger across the fruit!</div>
<canvas id="c" width="360" height="520"></canvas>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d'),W=360,H=520,GRAV=900;
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const FR=[{e:'🍎',c:'#e63946'},{e:'🍊',c:'#ff9f1c'},{e:'🍋',c:'#ffe066'},{e:'🍉',c:'#ff5d73'},{e:'🍓',c:'#ff4d6d'},{e:'🍇',c:'#8e5be8'},{e:'🍑',c:'#ffb199'},{e:'🍍',c:'#ffd23f'}];
const LV={easy:{gap:1.3,bomb:.07,multi:1},medium:{gap:1,bomb:.14,multi:2},hard:{gap:.8,bomb:.2,multi:3}};
let level='easy',state='ready',score=0,best=0,health=3,t=0,spawnT=.6,last=0,overAt=0,shake=0,flash=0;
let items=[],halves=[],parts=[],pops=[],trail=[],down=false,prev=null,swipeHits=0;
try{best=+localStorage.getItem('fruitBest')||0}catch(e){}
function ui(){
$('#hp').textContent='❤'.repeat(health)+'♡'.repeat(3-health);
$('#sc').textContent='⭐ '+score;
$('#bs').textContent='Best: '+best}
function reset(){
score=0;health=3;t=0;spawnT=.6;shake=0;flash=0;
items=[];halves=[];parts=[];pops=[];trail=[];swipeHits=0;
state='ready';
$('#fb').textContent='Swipe your finger across the fruit!';
ui()}
function launch(){
const c=LV[level],r=Math.random();
const kind=r<c.bomb?'bomb':r<c.bomb+.03?'star':'fruit',f=FR[RI(0,FR.length-1)];
const x=R(50,W-50),ay=R(H*.15,H*.5),vy=-Math.sqrt(2*GRAV*(H+30-ay)),ta=-vy/GRAV;
items.push({x,y:H+30,vx:(W/2-x)/(ta*2)*R(.3,1),vy,rot:R(0,6),vr:R(-4,4),kind,e:kind==='bomb'?'💣':kind==='star'?'⭐':f.e,c:kind==='bomb'?'#555':kind==='star'?'#ffd24d':f.c,r:30,sliced:false})}
function wave(){
const c=LV[level],n=RI(1,c.multi);
for(let i=0;i<n;i++)launch();
spawnT=c.gap*R(.8,1.2)*Math.max(.6,1-t/150)}
function juice(x,y,col,n){
for(let i=0;i<n;i++){const a=R(0,6.3),v=R(40,220);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:R(.4,.9),col,s:R(2,5)})}}
function over(){
state='over';overAt=performance.now();
GA.sfx('lose');
if(score>best){
best=score;
try{localStorage.setItem('fruitBest',best)}catch(e){}}
ui();
$('#fb').textContent='Boom! Score '+score+' (best '+best+'). Tap to try again 💪'}
function slice(it){
if(it.sliced||state!=='play')return;
it.sliced=true;
if(it.kind==='bomb'){
juice(it.x,it.y,'#ff8a3d',30);juice(it.x,it.y,'#ffd166',20);
health--;shake=.4;flash=.35;
GA.sfx('hit');
ui();
if(health<=0)over();
else $('#fb').textContent='Ouch, a bomb! '+health+' '+(health===1?'life':'lives')+' left';
return}
swipeHits++;
const pts=it.kind==='star'?5:1;
score+=pts;
juice(it.x,it.y,it.c,it.kind==='star'?24:14);
halves.push({x:it.x,y:it.y,vx:it.vx-110,vy:it.vy*.4-40,rot:it.rot,vr:-3,e:it.e,side:-1},{x:it.x,y:it.y,vx:it.vx+110,vy:it.vy*.4-40,rot:it.rot,vr:3,e:it.e,side:1});
pops.push({x:it.x,y:it.y-20,text:'+'+pts,life:.8});
GA.sfx(it.kind==='star'?'win':'pop');
ui()}
function segHit(a,b,it){
const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;
const k=Math.max(0,Math.min(1,((it.x-a.x)*dx+(it.y-a.y)*dy)/l2));
return Math.hypot(it.x-(a.x+k*dx),it.y-(a.y+k*dy))<it.r+4}
function pos(e){
const r=cv.getBoundingClientRect();
return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function endSwipe(){
if(swipeHits>=2){
const b=swipeHits;
score+=b;
pops.push({x:prev?prev.x:W/2,y:prev?prev.y-30:H/2,text:'Combo x'+b+'! +'+b,life:1.3,big:true});
GA.sfx('good');
$('#fb').textContent='Combo x'+b+'! 🔥';
ui()}
swipeHits=0;down=false;prev=null}
cv.addEventListener('pointerdown',e=>{
cv.setPointerCapture(e.pointerId);
if(state==='over'){if(performance.now()-overAt>600){reset();state='play';$('#fb').textContent='Slice the fruit, avoid the bombs 💣'}return}
if(state==='ready'){state='play';$('#fb').textContent='Slice the fruit, avoid the bombs 💣'}
down=true;prev=pos(e);trail=[{...prev,t:performance.now()}];swipeHits=0});
cv.addEventListener('pointermove',e=>{
if(!down||state!=='play')return;
const p=pos(e);
trail.push({...p,t:performance.now()});
if(Math.hypot(p.x-prev.x,p.y-prev.y)>3)items.forEach(it=>{if(segHit(prev,p,it))slice(it)});
prev=p});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,endSwipe));
function update(dt){
t+=dt;
spawnT-=dt;
if(spawnT<=0)wave();
items.forEach(i=>{i.vy+=GRAV*dt;i.x+=i.vx*dt;i.y+=i.vy*dt;i.rot+=i.vr*dt});
items=items.filter(i=>!i.sliced&&!(i.y>H+60&&i.vy>0))}
function draw(){
g.save();
if(shake>0)g.translate(R(-5,5),R(-5,5));
const bg=g.createLinearGradient(0,0,0,H);
bg.addColorStop(0,'#233a60');bg.addColorStop(1,'#3d6a8a');
g.fillStyle=bg;g.fillRect(-10,-10,W+20,H+20);
g.fillStyle='rgba(255,255,255,.05)';
for(let k=0;k<14;k++){g.beginPath();g.arc((k*83)%W,(k*127+t*8)%H,18+k%4*8,0,7);g.fill()}
g.textAlign='center';g.textBaseline='middle';
halves.forEach(h=>{
g.save();g.translate(h.x,h.y);g.rotate(h.rot);
g.beginPath();g.rect(h.side<0?-40:0,-40,40,80);g.clip();
g.font='58px Arial';g.fillText(h.e,h.side*3,0);g.restore()});
items.forEach(i=>{
g.save();g.translate(i.x,i.y);g.rotate(i.rot);
if(i.kind==='star'){g.fillStyle='rgba(255,210,77,.35)';g.beginPath();g.arc(0,0,38,0,7);g.fill()}
g.font='58px Arial';g.fillText(i.e,0,0);g.restore()});
parts.forEach(p=>{g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()});
g.globalAlpha=1;
const now=performance.now();
trail=trail.filter(p=>now-p.t<220);
for(let k=1;k<trail.length;k++){
const a=1-(now-trail[k].t)/220;
g.strokeStyle='rgba(255,255,255,'+a.toFixed(2)+')';g.lineWidth=2+a*8;g.lineCap='round';
g.beginPath();g.moveTo(trail[k-1].x,trail[k-1].y);g.lineTo(trail[k].x,trail[k].y);g.stroke()}
g.lineJoin='round';
pops.forEach(p=>{
g.globalAlpha=Math.min(1,p.life*1.5);
g.font='700 '+(p.big?30:24)+'px Fredoka,Arial,sans-serif';
g.strokeStyle='#4a1020';g.lineWidth=6;g.strokeText(p.text,p.x,p.y);
g.fillStyle='#ffe066';g.fillText(p.text,p.x,p.y)});
g.globalAlpha=1;
if(flash>0){g.fillStyle='rgba(255,60,60,'+(flash*1.4).toFixed(2)+')';g.fillRect(-10,-10,W+20,H+20)}
function label(s,y,sz,col){
g.font='700 '+sz+'px Fredoka,Arial,sans-serif';
g.strokeStyle='#1b1b1b';g.lineWidth=7;g.strokeText(s,W/2,y);
g.fillStyle=col;g.fillText(s,W/2,y)}
if(state==='ready'){label('FRUIT SLICE',H/2-40,40,'#fff');label('Swipe to slice! 🍉',H/2+10,24,'#ffd166')}
if(state==='over'){label('BOOM!',H/2-50,52,'#ff5d5d');label('Score: '+score,H/2,28,'#fff');label('Tap to try again',H/2+44,22,'#ffd166')}
g.restore()}
function frame(ts){
const dt=Math.min((ts-last)/1000,.05);
last=ts;
if(state==='play')update(dt);
else if(state==='ready'){spawnT-=dt;if(spawnT<=0){spawnT=1.4;launch()}items.forEach(i=>{i.vy+=GRAV*dt;i.x+=i.vx*dt;i.y+=i.vy*dt;i.rot+=i.vr*dt});items=items.filter(i=>!(i.y>H+60&&i.vy>0))}
halves.forEach(h=>{h.vy+=GRAV*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt});
halves=halves.filter(h=>h.y<H+80);
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt});
parts=parts.filter(p=>p.life>0);
pops.forEach(p=>{p.y-=26*dt;p.life-=dt});
pops=pops.filter(p=>p.life>0);
if(shake>0)shake-=dt;
if(flash>0)flash-=dt;
draw();
requestAnimationFrame(frame)}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
reset()});
reset();
requestAnimationFrame(frame);
GA.init({"root": 329.63, "scale": [0, 2, 4, 7, 9], "wave": "triangle", "bpm": 128, "gain": 0.07, "pat": "0 2 4 2 7 4 2 0 4 7 9 7 4 2 4 _"});
</script>
</body>
</html>
