<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miniature Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfeaf2;--card:#fff;--ink:#1d3347;--muted:#5a7185;--accent:#e08a1e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1822;--card:#172636;--ink:#e3eef7;--muted:#8fa5b8;--accent:#f4a640}}
:root[data-theme="dark"]{--bg:#0e1822;--card:#172636;--ink:#e3eef7;--muted:#8fa5b8;--accent:#f4a640}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center;padding:14px 16px}
main{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
h1{font-family:Caveat,cursive;font-size:2.5rem;margin:0;text-align:center;line-height:1}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.score div{background:var(--card);border-radius:12px;padding:6px 4px}
.score b{display:block;font:700 1.4rem Arial,sans-serif}
.score span{font-size:.8rem;color:var(--muted)}
#status{text-align:center;font-weight:800;min-height:2.6em}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:14px;background:#dff0f2}
#joy{position:relative;width:150px;height:150px;margin:4px auto;border-radius:50%;background:var(--card);border:3px solid var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);pointer-events:none}
#exit{text-align:center;text-decoration:none;font:800 1rem Nunito,sans-serif;padding:11px;border-radius:12px;border:2px solid var(--ink);color:var(--ink)}
#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#1d3347;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:3rem;margin:0;letter-spacing:.3rem}
#welcome h2{font-family:Caveat,cursive;font-size:3.2rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#5a7185;font-weight:800}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🧙💎🚪</p><h2>Welcome</h2><p class="sub">Let’s start the Miniature Adventure</p></div></div>
<main>
<h1>Miniature Adventure</h1>
<div class="score">
<div><b id="lv">1/3</b><span>Level</span></div>
<div><b id="gm">0/0</b><span>Gems</span></div>
</div>
<div id="status" aria-live="polite"></div>
<canvas id="c" width="360" height="360"></canvas>
<div id="joy" aria-label="Joystick"><div id="knob"></div></div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d'),T=40;
const HINT='Drag the joystick to move. Collect every 💎, then reach the 🚪';
const rnd=(a,b)=>a+Math.random()*(b-a+1)|0;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function gen(){
const m=Array.from({length:9},()=>Array(9).fill('#'));
const st=[[1,1]];
m[1][1]=' ';
while(st.length){
const[x,y]=st[st.length-1];
const n=shuffle([[2,0],[-2,0],[0,2],[0,-2]]).filter(([a,b])=>x+a>0&&x+a<8&&y+b>0&&y+b<8&&m[y+b][x+a]==='#');
if(!n.length){st.pop();continue}
const[a,b]=n[0];
m[y+b/2][x+a/2]=' ';
m[y+b][x+a]=' ';
st.push([x+a,y+b])}
for(let k=0;k<6;k++){
const x=rnd(1,7),y=rnd(1,7);
if((x+y)%2===1&&m[y][x]==='#')m[y][x]=' '}
return m}
const joy={x:0,y:0};
let lv=0,M,hero,door,enemies,gems,got,total,state,locked=false,last=0;
const W=(x,y)=>M[y/T|0][x/T|0]==='#';
const blocked=(x,y)=>[[-11,-11],[11,-11],[-11,11],[11,11]].some(([a,b])=>W(x+a,y+b));
const status=t=>$('#status').textContent=t;
const near=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
function ui(){
$('#lv').textContent=lv+1;
$('#gm').textContent=got+'/'+total}
function load(){
M=gen();
const d={'1,1':0},q=[[1,1]],f=[];
while(q.length){
const[x,y]=q.shift();
f.push([x,y]);
[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{
const k=(x+a)+','+(y+b);
if(M[y+b][x+a]!=='#'&&!(k in d)){d[k]=d[x+','+y]+1;q.push([x+a,y+b])}})}
const P=([x,y])=>({x:x*T+T/2,y:y*T+T/2});
hero=P([1,1]);
door=P(f[f.length-1]);
const rest=shuffle(f.slice(1,-1));
gems=rest.splice(0,Math.min(3+(lv>>1),8)).map(P);
enemies=[];
rest.filter(([x,y])=>d[x+','+y]>=6).forEach(([x,y])=>{
if(enemies.length>=Math.min(lv,6))return;
const h=M[y][x-1]!=='#'&&M[y][x+1]!=='#';
const v=M[y-1][x]!=='#'&&M[y+1][x]!=='#';
if(h||v)enemies.push({...P([x,y]),dx:h?1:0,dy:h?0:1})});
total=gems.length;got=0;state='play';locked=false;
status(HINT);
ui()}
function lose(){
state='dead';GA.sfx('lose');
status('Caught! Tap the board to retry')}
function win(){
state='next';GA.sfx('win');
status('Level cleared! Tap the board for the next level')}
function update(dt){
const nx=hero.x+joy.x*120*dt,ny=hero.y+joy.y*120*dt;
if(!blocked(nx,hero.y))hero.x=nx;
if(!blocked(hero.x,ny))hero.y=ny;
gems=gems.filter(p=>{
const d=near(p,hero,22);
if(d){got++;GA.sfx('good')}
return!d});
enemies.forEach(e=>{
const ex=e.x+e.dx*55*dt,ey=e.y+e.dy*55*dt;
if(W(ex+e.dx*16,ey+e.dy*16)){e.dx=-e.dx;e.dy=-e.dy}
else{e.x=ex;e.y=ey}});
ui();
if(enemies.some(e=>near(e,hero,24)))return lose();
if(near(door,hero,22)){
if(got===total)return win();
locked=true;
status('The door is locked. Collect every 💎 first')}
else if(locked){locked=false;status(HINT)}}
function draw(){
g.fillStyle='#dff0f2';g.fillRect(0,0,360,360);
g.fillStyle='#3c5a6b';
M.forEach((r,y)=>r.forEach((c,x)=>{if(c==='#')g.fillRect(x*T,y*T,T,T)}));
g.textAlign='center';g.textBaseline='middle';g.font='28px Arial';
g.globalAlpha=got===total?1:.4;
g.fillText('🚪',door.x,door.y+2);
g.globalAlpha=1;
gems.forEach(p=>g.fillText('💎',p.x,p.y+2));
enemies.forEach(e=>g.fillText('👾',e.x,e.y+2));
g.fillText('🧙',hero.x,hero.y+2)}
function frame(t){
const dt=Math.min((t-last)/1000,.05);
last=t;
if(state==='play')update(dt);
draw();
requestAnimationFrame(frame)}
cv.addEventListener('click',()=>{
if(state==='dead')load();
else if(state==='next'){lv++;load()}});
const J=$('#joy'),K=$('#knob'),R=43;
function stick(e){
const r=J.getBoundingClientRect();
let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
const d=Math.hypot(dx,dy),k=Math.min(d,R)/(d||1);
dx*=k;dy*=k;
K.style.transform='translate('+dx+'px,'+dy+'px)';
const m=Math.hypot(dx,dy)/R;
joy.x=m<.12?0:dx/R;
joy.y=m<.12?0:dy/R}
function release(){
joy.x=joy.y=0;
K.style.transform=''}
J.addEventListener('pointerdown',e=>{J.setPointerCapture(e.pointerId);stick(e)});
J.addEventListener('pointermove',e=>{if(J.hasPointerCapture(e.pointerId))stick(e)});
J.addEventListener('pointerup',release);
J.addEventListener('pointercancel',release);
load();
requestAnimationFrame(frame);
GA.init({"root": 220, "scale": [0, 2, 3, 5, 7, 8, 10], "wave": "sine", "bpm": 84, "gain": 0.12, "pat": "0 2 4 2 5 4 2 0 3 2 1 0 2 _ _ _"});
</script>
</body>
</html>
