<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e0f2ff;--card:#fff;--ink:#16324f;--muted:#5b7894;--accent:#ff8a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b2b;--card:#182b42;--ink:#e6f1fc;--muted:#93aac3;--accent:#ffa05c}}
:root[data-theme="dark"]{--bg:#0e1b2b;--card:#182b42;--ink:#e6f1fc;--muted:#93aac3;--accent:#ffa05c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:8px 2px;border-radius:10px;cursor:pointer;line-height:1.2}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.05rem}
.card{background:var(--card);border-radius:18px;padding:22px 12px;text-align:center}
#eq{font-size:2.8rem;font-weight:700}
#vis{font-size:1.5rem;min-height:1.6em;word-break:break-all}
#fb{text-align:center;font-weight:600;font-size:1.15rem;min-height:1.6em}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#opts button{border:0;border-radius:16px;color:#fff;font:700 2rem Fredoka,sans-serif;padding:20px 0;cursor:pointer}
#opts button:nth-child(1){background:#ef5b5b}
#opts button:nth-child(2){background:#2f80ed}
#opts button:nth-child(3){background:#2fa86a}
#opts button:nth-child(4){background:#8e5be8}
#opts button.ok{background:#1f9d4d;outline:4px solid #b9f0cc}
#opts button.no{opacity:.35;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#16324f;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.6rem;margin:0;letter-spacing:.3rem}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#5b7894;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}#opts button.no{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">➕➖✖️➗</p><h2>Welcome</h2><p class="sub">Let’s play Math Challenge</p></div></div>
<main>
<h1>Math Challenge</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div id="game">
<div class="bar"><span id="prog"></span><span id="sc"></span></div>
<div class="card"><div id="eq"></div><div id="vis"></div></div>
<div id="fb" aria-live="polite"></div>
<div id="opts"></div>
</div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a+1)|0;
const spread={easy:3,medium:6,hard:12};
let level='easy',i,score,cur,tried,locked;
function make(){
let a,b,op,ans,r=Math.random();
if(level==='easy'){
if(r<.6){op='+';a=R(1,9);b=R(1,10-a);ans=a+b}
else{op='−';a=R(2,10);b=R(1,a-1);ans=a-b}}
else if(level==='medium'){
if(r<.35){op='+';a=R(5,30);b=R(5,30);ans=a+b}
else if(r<.65){op='−';a=R(10,50);b=R(1,a-1);ans=a-b}
else{op='×';a=[2,3,4,5,10][R(0,4)];b=R(1,10);ans=a*b}}
else{
if(r<.2){op='+';a=R(20,99);b=R(20,99);ans=a+b}
else if(r<.4){op='−';a=R(30,99);b=R(10,a-1);ans=a-b}
else if(r<.75){op='×';a=R(2,12);b=R(2,12);ans=a*b}
else{op='÷';b=R(2,12);ans=R(2,12);a=b*ans}}
const s=new Set([ans]);
while(s.size<4){const v=ans+R(-spread[level],spread[level]);if(v>=0)s.add(v)}
const opts=[...s].sort(()=>Math.random()-.5);
return{a,b,op,ans,opts}}
function ui(){
$('#prog').textContent='Question '+(i+1);
$('#sc').textContent='⭐ '+score}
function next(){
cur=make();tried=false;locked=false;
$('#eq').textContent=cur.a+' '+cur.op+' '+cur.b+' = ?';
$('#vis').textContent=level==='easy'?'🍎'.repeat(cur.a)+' '+cur.op+' '+'🍎'.repeat(cur.b):'';
$('#fb').textContent='';
const o=$('#opts');
o.innerHTML='';
cur.opts.forEach(v=>{
const b=document.createElement('button');
b.textContent=v;
b.onclick=()=>pick(b,v);
o.append(b)});
ui()}
function pick(b,v){
if(locked)return;
if(v===cur.ans){
locked=true;GA.sfx('good');
b.classList.add('ok');
if(!tried)score++;
$('#fb').textContent=['Great job! 🎉','Awesome! ⭐','You got it! 👏'][R(0,2)];
i++;ui();
setTimeout(next,900)}
else{
tried=true;GA.sfx('bad');
b.disabled=true;
b.classList.add('no');
$('#fb').textContent='Oops, try again! 💪'}}
function start(){
i=0;score=0;
next()}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
start()});
start();
GA.init({"root": 293.66, "scale": [0, 2, 4, 5, 7, 9, 11], "wave": "triangle", "bpm": 116, "gain": 0.1, "pat": "0 2 4 2 5 4 2 0 4 5 7 5 4 2 1 _"});
</script>
</body>
</html>
