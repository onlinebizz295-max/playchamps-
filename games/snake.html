<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f2e8;--card:#fff;--ink:#12261a;--muted:#587060;--accent:#2f9e57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1610;--card:#17251b;--ink:#e4f2e8;--muted:#8fa896;--accent:#4cd07d}}
:root[data-theme="dark"]{--bg:#0d1610;--card:#17251b;--ink:#e4f2e8;--muted:#8fa896;--accent:#4cd07d}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
h1{font-family:Caveat,cursive;font-size:3rem;margin:0;text-align:center;line-height:1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:800 .9rem Nunito,sans-serif;padding:9px 4px;border-radius:8px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.score div{background:var(--card);border-radius:12px;padding:8px 4px}
.score b{display:block;font:700 1.6rem Arial,sans-serif}
.score span{font-size:.8rem;color:var(--muted)}
#status{text-align:center;font-weight:800;min-height:1.5em}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:14px;touch-action:none;background:#12261a}
.pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,50px);gap:6px;justify-content:center}
.pad button{border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:1.3rem;cursor:pointer;touch-action:manipulation}
.pad [data-d="up"]{grid-column:2;grid-row:1}
.pad [data-d="left"]{grid-column:1;grid-row:2}
.pad [data-d="right"]{grid-column:3;grid-row:2}
.pad [data-d="down"]{grid-column:2;grid-row:3}
.actions{display:flex;gap:10px}
#exit{flex:1;text-align:center;text-decoration:none;font:800 1rem Nunito,sans-serif;padding:11px;border-radius:12px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#12261a;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .seg{display:flex;justify-content:center;gap:5px;margin:0 0 6px}
#welcome .seg i{width:26px;height:26px;border-radius:6px;background:#2f9e57}
#welcome .seg i:last-child{background:#d6334a;border-radius:50%}
#welcome h2{font-family:Caveat,cursive;font-size:3.2rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#587060;font-weight:800}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="seg"><i></i><i></i><i></i><i></i><i></i></p><h2>Welcome</h2><p class="sub">Let’s play Snake</p></div></div>
<main>
<h1>Snake</h1>
<div class="modes" id="modes">
<button data-m="easy" aria-pressed="false">Easy</button>
<button data-m="medium" aria-pressed="true">Medium</button>
<button data-m="hard" aria-pressed="false">Hard</button>
</div>
<div class="score">
<div><b id="sc">0</b><span>Score</span></div>
<div><b id="bs">0</b><span>Best</span></div>
</div>
<div id="status" aria-live="polite">Press an arrow key or button to start</div>
<canvas id="c" width="400" height="400"></canvas>
<div class="pad">
<button data-d="up" aria-label="Up">▲</button>
<button data-d="left" aria-label="Left">◀</button>
<button data-d="down" aria-label="Down">▼</button>
<button data-d="right" aria-label="Right">▶</button>
</div>
<div class="actions">
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</div>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d'),N=20,S=20;
const speeds={easy:150,medium:110,hard:75};
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let snake,dir,next,food,score,best=0,timer,state='idle',speed=speeds.medium;
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
const status=t=>$('#status').textContent=t;
function ui(){
$('#sc').textContent=score;
$('#bs').textContent=best}
function spawn(){
do food={x:Math.random()*N|0,y:Math.random()*N|0};
while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function reset(){
clearInterval(timer);
snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
dir=next={x:1,y:0};score=0;state='idle';
spawn();draw();ui()}
function draw(){
g.fillStyle='#12261a';g.fillRect(0,0,400,400);
g.fillStyle='#d6334a';
g.beginPath();g.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);g.fill();
snake.forEach((s,i)=>{
g.fillStyle=i?'#2f9e57':'#7be495';
g.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)})}
function run(){
clearInterval(timer);
state='run';
timer=setInterval(tick,speed);
status('Go!');ui()}
function pause(){
clearInterval(timer);
state='paused';
status('Paused. Press an arrow or tap the board to resume');ui()}
function end(){
clearInterval(timer);
state='over';GA.sfx('lose');
if(score>best){
best=score;
try{localStorage.setItem('snakeBest',best)}catch(e){}}
status('Game over. Press an arrow or tap the board to play again');
ui()}
function tick(){
dir=next;
const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))return end();
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;spawn();GA.sfx('good')}else snake.pop();
draw();ui()}
function turn(d){
const [dx,dy]=dirs[d];
if(state==='over')reset();
if(dx+dir.x!==0||dy+dir.y!==0)next={x:dx,y:dy};
if(state!=='run')run()}
function toggle(){
if(state==='run')pause();
else{if(state==='over')reset();run()}}
let p0;
cv.addEventListener('pointerdown',e=>{p0=e;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',e=>{
if(!p0)return;
const dx=e.clientX-p0.clientX,dy=e.clientY-p0.clientY;
p0=null;
if(Math.max(Math.abs(dx),Math.abs(dy))<24)return toggle();
turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
addEventListener('keydown',e=>{
const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];
if(k){e.preventDefault();turn(k)}
else if(e.key===' '){e.preventDefault();toggle()}});
document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>turn(b.dataset.d));
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
speed=speeds[b.dataset.m];
reset();
status('Press an arrow key or button to start')});
reset();
GA.init({"root": 196, "scale": [0, 3, 5, 7, 10], "wave": "square", "bpm": 132, "gain": 0.06, "pat": "0 2 3 2 0 _ 2 3 4 3 2 _ 5 4 3 2"});
</script>
</body>
</html>
