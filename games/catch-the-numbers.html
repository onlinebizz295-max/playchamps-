<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch the Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e0f7f4;--card:#fff;--ink:#0f3b36;--muted:#4f8079;--accent:#12a594;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1b19;--card:#12302c;--ink:#dff7f3;--muted:#8bbab3;--accent:#3cc9b7}}
:root[data-theme="dark"]{--bg:#0a1b19;--card:#12302c;--ink:#dff7f3;--muted:#8bbab3;--accent:#3cc9b7}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem}
#target{background:var(--card);border-radius:16px;padding:14px;text-align:center;font-size:1.4rem;font-weight:700}
#fb{text-align:center;font-weight:600;min-height:1.5em}
canvas{width:100%;aspect-ratio:360/440;display:block;border-radius:16px;touch-action:none;background:linear-gradient(#bfeaf5,#f0fbff)}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#0f3b36;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#4f8079;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🧺🔢</p><h2>Welcome</h2><p class="sub">Let’s catch some numbers</p></div></div>
<main>
<h1>Catch the Numbers</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span>Drag to move the basket</span><span id="sc">⭐ 0</span></div>
<div id="target"></div>
<div id="fb" aria-live="polite"></div>
<canvas id="c" width="360" height="440"></canvas>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a+1)|0;
const cv=$('#c'),g=cv.getContext('2d'),BY=405;
const cfg={easy:{v:90,s:1.3},medium:{v:130,s:1},hard:{v:170,s:.8}};
let level='easy',score=0,caught=0,tg,items=[],bx=180,acc=0,last=0;
function target(){
if(level==='easy'){
const n=R(1,9);
return{t:'Catch the number '+n,ok:v=>v===n,gen:()=>Math.random()<.4?n:R(1,9)}}
if(level==='medium'){
const k=R(0,2);
if(k===0)return{t:'Catch EVEN numbers',ok:v=>v%2===0,gen:()=>R(1,20)};
if(k===1)return{t:'Catch ODD numbers',ok:v=>v%2===1,gen:()=>R(1,20)};
return{t:'Catch numbers bigger than 10',ok:v=>v>10,gen:()=>R(1,20)}}
const a=R(2,12),b=R(2,12),s=a+b;
return{t:'Catch the answer: '+a+' + '+b,ok:v=>v===s,gen:()=>{const v=Math.random()<.4?s:s+R(-6,6);return v<1?s:v}}}
function setTarget(){
tg=target();
$('#target').textContent=tg.t}
function reset(){
score=0;caught=0;items=[];acc=0;
$('#sc').textContent='⭐ 0';
$('#fb').textContent='';
setTarget()}
function frame(t){
const dt=Math.min((t-last)/1000,.05);
last=t;
acc+=dt;
if(acc>cfg[level].s){
acc=0;
items.push({x:R(30,330),y:-30,n:tg.gen()})}
items.forEach(i=>i.y+=cfg[level].v*dt);
items=items.filter(i=>{
if(i.y>BY-26&&i.y<BY+22&&Math.abs(i.x-bx)<50){
if(tg.ok(i.n)){
score++;caught++;GA.sfx('good');
$('#sc').textContent='⭐ '+score;
if(caught%5===0){setTarget();$('#fb').textContent='New challenge! 🎯'}
else $('#fb').textContent=['Great catch! 🎉','Awesome! ⭐','Yes! 👏'][R(0,2)]}
else{GA.sfx('bad');$('#fb').textContent='Oops, not that one! 💪'}
return false}
return i.y<470});
g.clearRect(0,0,360,440);
g.textAlign='center';g.textBaseline='middle';
items.forEach(i=>{
g.fillStyle='hsl('+i.n*37%360+',70%,48%)';
g.beginPath();g.arc(i.x,i.y,25,0,7);g.fill();
g.fillStyle='#fff';g.font='700 24px Fredoka,Arial,sans-serif';
g.fillText(i.n,i.x,i.y+1)});
g.font='56px Arial';
g.fillText('🧺',bx,BY);
requestAnimationFrame(frame)}
function move(e){
const r=cv.getBoundingClientRect();
bx=Math.max(30,Math.min(330,(e.clientX-r.left)*360/r.width))}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);move(e)});
cv.addEventListener('pointermove',e=>{if(cv.hasPointerCapture(e.pointerId))move(e)});
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
reset()});
reset();
requestAnimationFrame(frame);
GA.init({"root": 277.18, "scale": [0, 2, 4, 5, 7, 9, 11], "wave": "triangle", "bpm": 124, "gain": 0.1, "pat": "0 4 2 5 4 2 4 7 5 4 2 0 2 4 2 _"});
</script>
</body>
</html>
