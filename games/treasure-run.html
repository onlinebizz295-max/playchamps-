<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Run</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#10231a;overscroll-behavior:none;touch-action:none;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;background:#10231a;overflow:hidden;color:#fff}
#c{position:absolute;display:block}
#exit{position:absolute;left:.6em;top:.6em;z-index:5;background:rgba(0,0,0,.55);color:#fff;text-decoration:none;font-weight:600;font-size:.85em;padding:.45em .8em;border-radius:2em;border:2px solid rgba(255,255,255,.5)}
#rotHint{position:absolute;left:50%;top:.6em;transform:translateX(-50%);z-index:5;background:#ffd166;color:#3a2a00;font-weight:700;font-size:.85em;padding:.4em 1em;border-radius:2em;white-space:nowrap}
.ov{position:absolute;inset:0;z-index:6;background:rgba(8,20,14,.72);display:flex;align-items:center;justify-content:center;padding:.8em;overflow:auto}
.panel{background:#fff7e0;color:#3a2a10;border-radius:1.2em;padding:1em 1.2em;text-align:center;max-width:34em;width:100%;box-shadow:0 .6em 2em rgba(0,0,0,.5)}
.panel h1{margin:0 0 .2em;font-size:2em;line-height:1.1}
.panel p{margin:.3em 0;font-size:.95em}
.seg{display:flex;gap:.4em;margin:.6em 0;background:#f0dfae;padding:.3em;border-radius:1em}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;color:#7a5c1e;padding:.5em;border-radius:.7em;cursor:pointer}
.seg button[aria-pressed="true"]{background:#3a2a10;color:#fff7e0}
.btn{border:0;border-radius:1em;font:inherit;font-weight:700;font-size:1.1em;padding:.6em 1.2em;margin:.25em;cursor:pointer;color:#fff;background:#2f9e57}
.btn.alt{background:#8e5be8}
.btn.ghost{background:#fff;color:#3a2a10;border:2px solid #3a2a10}
.stats{display:flex;justify-content:center;gap:1.2em;margin:.5em 0;font-weight:700}
.shead{display:flex;align-items:center;justify-content:space-between;gap:.6em;font-weight:700;font-size:1.15em}
.shead button{border:2px solid #3a2a10;background:#fff;border-radius:.7em;font:inherit;font-weight:700;padding:.2em .7em;cursor:pointer}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2em,1fr));gap:.6em;margin-top:.5em;max-height:12em;overflow:auto;padding:.2em}
.it{background:#fff;border-radius:.9em;padding:.4em;border:3px solid transparent;text-align:center}
.it.sel{border-color:#2f9e57}
.it canvas{width:5.2em;height:6.4em;display:block;margin:0 auto}
.it b{display:block;font-size:.85em}
.it button{width:100%;margin-top:.3em;border:0;border-radius:.6em;padding:.45em .2em;font:inherit;font-weight:700;font-size:.85em;background:#ff7043;color:#fff;cursor:pointer}
.it button:disabled{background:#2f9e57}
.it.lock button{background:#8e5be8}
.sw button{width:2.6em;height:2.6em;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.3);cursor:pointer;margin:.2em}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 4px #2f9e57}
#sfb{min-height:1.3em;font-weight:600;font-size:.9em;margin-top:.3em}
button:focus-visible,#exit:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:50;background:#fff;color:#3a2a10;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#7a5c1e;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🏃💎📦</p><h2>Welcome</h2><p class="sub">Let’s play Treasure Run</p></div></div>
<div id="stage">
<canvas id="c" width="800" height="450"></canvas>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">✕ Exit</a>
<div id="rotHint" hidden>📱 Turn your phone sideways to play</div>
<div id="menu" class="ov">
<div class="panel">
<h1>🏃 Treasure Run</h1>
<p>Tap to jump · tap again in the air to jump high · swipe down to slide</p>
<div class="seg" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="stats"><span id="mBest">Best: 0 m</span><span id="mCoins">🪙 0</span></div>
<button class="btn" id="play">▶ Play</button><button class="btn alt" id="openShop">🛒 Shop</button>
</div>
</div>
<div id="over" class="ov" hidden>
<div class="panel">
<h1>Oops! 💥</h1>
<div class="stats"><span id="oDist">0 m</span><span id="oCoins">🪙 0</span></div>
<p id="oBest"></p>
<button class="btn" id="again">▶ Play again</button><button class="btn alt" id="overShop">🛒 Shop</button>
</div>
</div>
<div id="shop" class="ov" hidden>
<div class="panel">
<div class="shead"><span>🛒 Shop</span><span id="wal">🪙 0</span><button id="sclose">✕ Close</button></div>
<div class="seg" id="tabs">
<button data-t="chars" aria-pressed="true">Characters</button>
<button data-t="hats" aria-pressed="false">Hats</button>
<button data-t="capes" aria-pressed="false">Capes</button>
<button data-t="colors" aria-pressed="false">Colors</button>
</div>
<div id="sfb" aria-live="polite">Pick a character, hat, cape or color</div>
<div class="items" id="items"></div>
</div>
</div>
</div>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#c'),g=cv.getContext('2d'),W=800,H=450,GY=360,PX=170,GR=2400,JV=760,JV2=700;
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CHARS=[{id:'explorer',name:'Explorer',price:0},{id:'ninja',name:'Ninja',price:800},{id:'knight',name:'Knight',price:2000},{id:'robot',name:'Robot',price:4000},{id:'pirate',name:'Pirate',price:6000}];
const HATS=[{id:'none',name:'No hat',price:0},{id:'cap',name:'Cap',price:200},{id:'cowboy',name:'Cowboy',price:600},{id:'crown',name:'Crown',price:2500}];
const CAPES=[{id:'none',name:'No cape',price:0},{id:'red',name:'Red cape',price:500,col:'#e63946'},{id:'blue',name:'Blue cape',price:500,col:'#1d9bf0'},{id:'gold',name:'Gold cape',price:1800,col:'#f2b705'}];
const COLORS=['#e63946','#ff8a3d','#ffd60a','#2fb344','#1d9bf0','#7c4dff','#ff6fb5','#111111','#ffffff','#8b5a2b'];
const LV={easy:{v:300,gap:360},medium:{v:360,gap:300},hard:{v:430,gap:250}};
const D={coins:0,best:0,char:'explorer',hat:'none',cape:'none',color:'#e63946',oc:['explorer'],oh:['none'],op:['none']};
try{Object.assign(D,JSON.parse(localStorage.getItem('treasureRun'))||{})}catch(e){}
const save=()=>{try{localStorage.setItem('treasureRun',JSON.stringify(D))}catch(e){}};
let level='easy',state='menu',rotated=false,hero,obs=[],items=[],pops=[],parts=[],t=0,off=0,V=300,dist=0,runCoins=0,hearts=3,inv=0,shield=0,magnet=0,dbl=0,nextX=0,last=0,flash=0,overAt=0,ph=0;
function layout(){
const w=innerWidth,h=innerHeight,por=h>w;
rotated=por;
const sw=por?h:w,sh=por?w:h;
stage.style.width=sw+'px';stage.style.height=sh+'px';
stage.style.transform=por?'rotate(90deg) translateY(-100%)':'none';
const sc=Math.min(sw/W,sh/H);
cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';
cv.style.left=(sw-W*sc)/2+'px';cv.style.top=(sh-H*sc)/2+'px';
stage.style.fontSize=clamp(sh/24,11,22)+'px';
$('#rotHint').hidden=!por}
function tryLandscape(){
try{
const d=document.documentElement;
if(d.requestFullscreen&&!document.fullscreenElement)d.requestFullscreen({navigationUI:'hide'}).then(()=>{if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape')}).catch(()=>{});
else if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
function limb(c,x0,y0,a,len,wid,col){
c.strokeStyle=col;c.lineWidth=wid;c.lineCap='round';
c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+Math.sin(a)*len,y0+Math.cos(a)*len);c.stroke()}
function rr(c,x,y,w,h,r){
c.beginPath();c.moveTo(x+r,y);
c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);
c.closePath()}
function drawHero(c,x,y,o){
const ch=o.char||'explorer',col=o.color||'#e63946',pose=o.pose||'stand',p=o.ph||0,hat=o.hat||'none',cape=CAPES.find(k=>k.id===(o.cape||'none'));
c.save();c.translate(x,y);c.scale(o.s||1,o.s||1);
if(pose==='slide'){c.translate(0,-12);c.rotate(-1.45)}else c.translate(0,-22);
const run=pose==='run',air=pose==='air';
const la=run?Math.sin(p)*.9:air?.7:0,lb=run?-Math.sin(p)*.9:air?-.35:0,aa=run?-Math.sin(p)*.9:air?-2.4:.1,ab=run?Math.sin(p)*.9:air?-2.8:-.1;
const pants=ch==='robot'?'#90a4ae':ch==='knight'?'#78909c':ch==='ninja'?'#1b1b1b':'#37474f';
const skin='#f6c9a0';
if(cape&&cape.col){const f=Math.sin(p*2)*5+(air?6:0);c.fillStyle=cape.col;c.beginPath();c.moveTo(-5,-24);c.lineTo(-30-f,-8+f/2);c.lineTo(-26-f,12);c.lineTo(-5,2);c.closePath();c.fill()}
limb(c,0,0,lb,22,6,pants);limb(c,0,-20,ab,16,5,ch==='robot'?'#90a4ae':skin);
c.fillStyle=pants;c.beginPath();c.arc(Math.sin(lb)*22,Math.cos(lb)*22,4,0,7);c.fill();
rr(c,-9,-27,18,29,5);c.fillStyle=col;c.fill();
c.fillStyle='rgba(0,0,0,.25)';c.fillRect(-9,-4,18,4);
limb(c,0,0,la,22,6,pants);
c.fillStyle='#222';c.beginPath();c.arc(Math.sin(la)*22,Math.cos(la)*22,4.5,0,7);c.fill();
if(ch==='knight'){c.fillStyle='#cfd8dc';c.beginPath();c.arc(-8,-24,5,0,7);c.arc(8,-24,5,0,7);c.fill()}
limb(c,0,-20,aa,16,5,ch==='robot'?'#90a4ae':skin);
if(ch==='robot'){rr(c,-11,-50,22,20,4);c.fillStyle='#b0bec5';c.fill();c.fillStyle='#00e5ff';c.fillRect(-7,-44,5,6);c.fillRect(2,-44,5,6);c.fillStyle='#b0bec5';c.fillRect(-1,-58,2,8);c.fillStyle='#ff5252';c.beginPath();c.arc(0,-59,3,0,7);c.fill()}
else{
c.fillStyle=ch==='ninja'?'#1b1b1b':skin;c.beginPath();c.arc(1,-37,11,0,7);c.fill();
if(ch==='ninja'){c.fillStyle=skin;c.fillRect(-8,-41,19,7);c.fillStyle=col;c.fillRect(-10,-46,22,4);c.beginPath();c.moveTo(-10,-45);c.lineTo(-22,-40);c.lineTo(-12,-41);c.fill()}
else if(ch==='knight'){c.fillStyle='#b0bec5';c.beginPath();c.arc(1,-39,12,Math.PI,0);c.fill();c.fillRect(-11,-39,24,12);c.fillStyle='#263238';c.fillRect(-4,-40,15,4);c.fillStyle='#e63946';c.beginPath();c.ellipse(-2,-52,3,8,-.4,0,7);c.fill()}
else if(ch==='pirate'){c.fillStyle='#c62828';c.beginPath();c.arc(1,-40,11.5,Math.PI,0);c.fill();c.fillRect(-10.5,-41,23,5);c.fillStyle='#111';c.beginPath();c.arc(6,-37,3.4,0,7);c.fill();c.fillRect(-9,-44,22,1.4)}
else{c.fillStyle='#222';c.beginPath();c.arc(5,-38,1.8,0,7);c.fill();c.fillStyle='#c8a165';c.beginPath();c.ellipse(1,-44,17,4,0,0,7);c.fill();c.beginPath();c.arc(1,-46,9,Math.PI,0);c.fill()}
if(ch==='ninja'||ch==='knight'){c.fillStyle='#fff';c.beginPath();c.arc(6,-38,2.4,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(6.8,-38,1.2,0,7);c.fill()}}
const top=ch==='robot'?-52:ch==='knight'?-48:-48;
if(hat==='cap'){c.fillStyle='#1d9bf0';c.beginPath();c.arc(1,top+6,10,Math.PI,0);c.fill();c.fillRect(2,top+5,15,3.5)}
else if(hat==='cowboy'){c.fillStyle='#8b5a2b';c.beginPath();c.ellipse(1,top+7,19,4.5,0,0,7);c.fill();rr(c,-6,top-6,14,13,4);c.fill();c.fillStyle='#5d3a1a';c.fillRect(-6,top+3,14,3)}
else if(hat==='crown'){c.fillStyle='#ffd24d';c.beginPath();c.moveTo(-9,top+7);c.lineTo(-9,top-4);c.lineTo(-4,top+2);c.lineTo(1,top-6);c.lineTo(6,top+2);c.lineTo(11,top-4);c.lineTo(11,top+7);c.closePath();c.fill();c.fillStyle='#e63946';c.beginPath();c.arc(1,top+3,2,0,7);c.fill()}
c.restore()}
function setState(s){state=s}
function reset(){
hero={y:GY,vy:0,ground:true,jumps:0,slide:0,fast:false};
obs=[];items=[];pops=[];parts=[];
t=0;dist=0;runCoins=0;hearts=3;inv=0;shield=0;magnet=0;dbl=0;nextX=400;V=LV[level].v}
function startRun(){
reset();
$('#menu').hidden=true;$('#over').hidden=true;$('#shop').hidden=true;
setState('play')}
function addCoins(n){runCoins+=n;D.coins+=n;save()}
function pop(x,y,txt){pops.push({x,y,txt,life:1.4})}
function burst(x,y,n,cols){for(let i=0;i<n;i++){const a=R(0,6.3),v=R(60,240);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:R(.4,.9),col:cols[i%cols.length]})}}
function spawn(){
const ox=W+80,r=Math.random();
let width=200;
const arc=(x0,w,y0,hgt,n)=>{for(let i=0;i<n;i++){const a=n>1?i/(n-1):.5;items.push({t:'coin',x:x0+a*w,y:y0-Math.sin(a*Math.PI)*hgt})}};
if(r<.2){obs.push({t:'rock',x:ox});arc(ox-80,160,GY-26,115,5);width=160}
else if(r<.36){obs.push({t:'rock',x:ox},{t:'rock',x:ox+230});arc(ox-60,350,GY-26,125,7);width=300}
else if(r<.52){obs.push({t:'log',x:ox});for(let i=0;i<5;i++)items.push({t:'coin',x:ox-70+i*35,y:GY-24});width=160}
else if(r<.68){obs.push({t:'wall',x:ox});arc(ox-70,140,GY-170,36,5);if(Math.random()<.3)items.push({t:'chest',x:ox,y:GY-196});else if(hearts<5&&Math.random()<.4)items.push({t:'heart',x:ox,y:GY-200});width=170}
else if(r<.8){for(let i=0;i<8;i++)items.push({t:'coin',x:ox+i*36,y:GY-26});width=290}
else if(r<.92){arc(ox-90,180,GY-90,130,7);if(Math.random()<.28)items.push({t:'chest',x:ox,y:GY-226});width=190}
else{items.push({t:'heart',x:ox,y:GY-30});obs.push({t:'rock',x:ox+260});width=300}
nextX=width+LV[level].gap+R(0,100)}
function jump(){
if(state!=='play')return;
if(hero.ground){hero.vy=-JV;hero.ground=false;hero.jumps=1;hero.slide=0;GA.sfx('jump')}
else if(hero.jumps<2){hero.vy=-JV2;hero.jumps=2;GA.sfx('jump')}}
function slide(){
if(state!=='play')return;
if(hero.ground)hero.slide=.75;
else{hero.vy=Math.max(hero.vy,1100);hero.fast=true}}
function hb(){return hero.slide>0?[PX-24,hero.y-26,PX+24,hero.y]:[PX-13,hero.y-56,PX+13,hero.y]}
function orect(o){
return o.t==='rock'?[o.x-20,GY-36,o.x+20,GY]:o.t==='wall'?[o.x-20,GY-150,o.x+20,GY]:[o.x-46,0,o.x+46,GY-46]}
const hit=(a,b)=>a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1];
function die(){
setState('over');overAt=performance.now();
GA.sfx('lose');
const m=Math.floor(dist);
const nb=m>D.best;
if(nb)D.best=m;
save();
burst(PX,hero.y-30,26,['#ff5d5d','#ffd166','#fff']);
setTimeout(()=>{
$('#oDist').textContent=m+' m';
$('#oCoins').textContent='🪙 '+runCoins;
$('#oBest').textContent=nb?'🏆 New best distance!':'Best: '+D.best+' m';
$('#over').hidden=false},650)}
function hurt(){
if(inv>0)return;
if(shield>0){shield=0;inv=1;pop(PX,hero.y-70,'🛡 Blocked!');GA.sfx('tick');return}
hearts--;inv=1.6;flash=.25;GA.sfx('hit');
burst(PX,hero.y-30,12,['#ff5d5d','#fff']);
if(hearts<=0)die()}
function chest(x,y){
const r=Math.random();let txt;
if(r<.4){const n=RI(20,40)*(dbl>0?2:1);addCoins(n);txt='+'+n+' coins!'}
else if(r<.6){magnet=10;txt='🧲 Magnet!'}
else if(r<.75){shield=1;txt='🛡 Shield!'}
else if(r<.9){hearts=Math.min(5,hearts+1);txt='❤ +1 heart!'}
else{dbl=12;txt='⭐ Double coins!'}
pop(x,y-20,'📦 '+txt);burst(x,y,16,['#ffd24d','#fff','#ff8a3d']);GA.sfx('win')}
function update(dt){
t+=dt;
V=LV[level].v+Math.min(200,t*4);
off+=V*dt;dist+=V*dt/50;ph+=V*dt/30;
if(inv>0)inv-=dt;if(flash>0)flash-=dt;if(magnet>0)magnet-=dt;if(dbl>0)dbl-=dt;
hero.vy+=GR*dt;hero.y+=hero.vy*dt;
if(hero.y>=GY){
const was=hero.ground;
hero.y=GY;hero.vy=0;hero.ground=true;hero.jumps=0;
if(!was&&hero.fast){hero.slide=.6}
hero.fast=false}
if(hero.slide>0)hero.slide-=dt;
nextX-=V*dt;
if(nextX<=0)spawn();
obs.forEach(o=>o.x-=V*dt);items.forEach(i=>i.x-=V*dt);
obs=obs.filter(o=>o.x>-120);items=items.filter(i=>i.x>-60);
const me=hb();
for(const o of obs)if(hit(me,orect(o))){hurt();break}
if(state!=='play')return;
items=items.filter(i=>{
if(magnet>0&&i.t==='coin'){const dx=PX-i.x,dy=hero.y-30-i.y,d=Math.hypot(dx,dy);if(d<260){i.x+=dx/d*700*dt;i.y+=dy/d*700*dt}}
const r=i.t==='chest'?[i.x-20,i.y-16,i.x+20,i.y+16]:[i.x-14,i.y-14,i.x+14,i.y+14];
if(hit(me,r)){
if(i.t==='coin'){addCoins(dbl>0?2:1);GA.sfx('tick')}
else if(i.t==='heart'){hearts=Math.min(5,hearts+1);pop(i.x,i.y-20,'❤ +1');GA.sfx('good')}
else chest(i.x,i.y);
return false}
return true})}
const tile=(per,o,fn)=>{for(let x=-(o%per)-per;x<W+per;x+=per)fn(x)};
function drawWorld(){
const sky=g.createLinearGradient(0,0,0,GY);sky.addColorStop(0,'#6ec6ff');sky.addColorStop(1,'#e6f9ff');
g.fillStyle=sky;g.fillRect(0,0,W,H);
g.fillStyle='#fff3b0';g.beginPath();g.arc(660,80,38,0,7);g.fill();
g.fillStyle='rgba(255,255,255,.92)';
tile(330,off*.05,x=>{[[0,0,26],[30,-8,34],[66,2,24]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(x+dx+60,70+dy,r,0,7);g.fill()})});
g.fillStyle='#9ccfa5';
tile(520,off*.12,x=>{g.beginPath();g.moveTo(x,GY);g.lineTo(x+150,GY-170);g.lineTo(x+300,GY);g.fill();g.beginPath();g.moveTo(x+220,GY);g.lineTo(x+360,GY-120);g.lineTo(x+520,GY);g.fill()});
tile(170,off*.4,x=>{g.fillStyle='#5d4037';g.fillRect(x+20,GY-70,12,70);g.fillStyle='#2e7d32';g.beginPath();g.arc(x+26,GY-86,32,0,7);g.arc(x+8,GY-66,22,0,7);g.arc(x+44,GY-66,22,0,7);g.fill()});
g.fillStyle='#6d4c41';g.fillRect(0,GY,W,H-GY);
g.fillStyle='#4caf50';g.fillRect(0,GY,W,16);
g.fillStyle='#43a047';tile(40,off,x=>{g.fillRect(x,GY+2,18,12)});
g.fillStyle='#5d4037';tile(90,off,x=>{g.fillRect(x+10,GY+34,34,8);g.fillRect(x+50,GY+62,26,8)})}
function drawObs(o){
if(o.t==='rock'){g.fillStyle='#78909c';g.beginPath();g.moveTo(o.x-22,GY);g.lineTo(o.x-14,GY-30);g.lineTo(o.x+4,GY-38);g.lineTo(o.x+20,GY-24);g.lineTo(o.x+24,GY);g.fill();g.fillStyle='#b0bec5';g.beginPath();g.moveTo(o.x-8,GY-30);g.lineTo(o.x+4,GY-36);g.lineTo(o.x+10,GY-26);g.fill()}
else if(o.t==='wall'){for(let k=0;k<3;k++){const y=GY-50*(k+1);g.fillStyle='#a1662f';g.fillRect(o.x-21,y,42,50);g.strokeStyle='#5d3a1a';g.lineWidth=3;g.strokeRect(o.x-21,y,42,50);g.beginPath();g.moveTo(o.x-21,y);g.lineTo(o.x+21,y+50);g.moveTo(o.x+21,y);g.lineTo(o.x-21,y+50);g.stroke()}}
else{g.strokeStyle='#4e7d3a';g.lineWidth=4;g.beginPath();g.moveTo(o.x-34,0);g.lineTo(o.x-34,GY-70);g.moveTo(o.x+34,0);g.lineTo(o.x+34,GY-70);g.stroke();g.fillStyle='#8d5a2b';rr(g,o.x-48,GY-76,96,30,12);g.fill();g.strokeStyle='#5d3a1a';g.lineWidth=3;g.stroke();g.fillStyle='#b9824a';g.beginPath();g.arc(o.x+46,GY-61,9,0,7);g.fill()}}
function drawItem(i){
if(i.t==='coin'){const w=Math.abs(Math.cos(t*6+i.x*.02))*9+3;g.fillStyle='#e0a100';g.beginPath();g.ellipse(i.x,i.y,w+2,13,0,0,7);g.fill();g.fillStyle='#ffd24d';g.beginPath();g.ellipse(i.x,i.y,w,11,0,0,7);g.fill()}
else if(i.t==='heart'){g.fillStyle='#ff4d6d';g.beginPath();g.arc(i.x-7,i.y-4,8,0,7);g.arc(i.x+7,i.y-4,8,0,7);g.fill();g.beginPath();g.moveTo(i.x-15,i.y-1);g.lineTo(i.x,i.y+17);g.lineTo(i.x+15,i.y-1);g.fill()}
else{g.fillStyle='#8d5a2b';rr(g,i.x-20,i.y-14,40,30,5);g.fill();g.fillStyle='#a1662f';g.fillRect(i.x-20,i.y-14,40,12);g.fillStyle='#ffd24d';g.fillRect(i.x-4,i.y-14,8,30);g.fillRect(i.x-20,i.y-4,40,4);g.strokeStyle='#5d3a1a';g.lineWidth=2;g.strokeRect(i.x-20,i.y-14,40,30);g.fillStyle='rgba(255,236,150,.5)';g.beginPath();g.arc(i.x,i.y-2,28+Math.sin(t*5)*3,0,7);g.fill()}}
function draw(){
g.save();
if(flash>0)g.translate(R(-5,5),R(-5,5));
drawWorld();
obs.forEach(drawObs);
items.forEach(drawItem);
const pose=hero.slide>0?'slide':hero.ground?'run':'air';
if(!(inv>0&&Math.floor(inv*12)%2)){
drawHero(g,PX,hero.y,{char:D.char,color:D.color,hat:D.hat,cape:D.cape,pose:state==='menu'?'run':pose,ph:ph})}
if(shield>0){g.strokeStyle='rgba(120,200,255,.9)';g.lineWidth=4;g.beginPath();g.arc(PX,hero.y-30,40,0,7);g.stroke();g.fillStyle='rgba(120,200,255,.2)';g.fill()}
parts.forEach(p=>{g.globalAlpha=Math.min(1,p.life*2);g.fillStyle=p.col;g.fillRect(p.x-3,p.y-3,6,6)});
g.globalAlpha=1;
g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
pops.forEach(p=>{g.globalAlpha=Math.min(1,p.life);g.font='700 24px Fredoka,Arial,sans-serif';g.strokeStyle='#3a2a10';g.lineWidth=6;g.strokeText(p.txt,p.x,p.y);g.fillStyle='#fff';g.fillText(p.txt,p.x,p.y)});
g.globalAlpha=1;
if(state==='play'||state==='over'){
g.textAlign='left';g.font='700 26px Arial';
for(let i=0;i<5;i++){g.fillStyle=i<hearts?'#ff4d6d':'rgba(0,0,0,.35)';g.fillText('♥',100+i*28,30)}
g.font='700 18px Fredoka,Arial,sans-serif';
let ix=100;
[['🛡',shield>0],['🧲',magnet>0],['⭐',dbl>0]].forEach(([e,on])=>{if(on){g.fillText(e,ix,62);ix+=30}});
g.textAlign='center';
function lab(s,x,y,sz){g.font='700 '+sz+'px Fredoka,Arial,sans-serif';g.strokeStyle='#3a2a10';g.lineWidth=6;g.strokeText(s,x,y);g.fillStyle='#fff';g.fillText(s,x,y)}
lab(Math.floor(dist)+' m',W/2,30,30);
lab('🪙 '+runCoins,W-170,30,26)}
g.restore()}
function frame(ts){
const dt=Math.min((ts-last)/1000,.05);last=ts;
if(state==='play')update(dt);
else if(state==='menu'){off+=140*dt;ph+=140*dt/30;t+=dt}
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt});
parts=parts.filter(p=>p.life>0);
pops.forEach(p=>{p.y-=36*dt;p.life-=dt});
pops=pops.filter(p=>p.life>0);
draw();
requestAnimationFrame(frame)}
const mapD=(dx,dy)=>rotated?{x:dy,y:-dx}:{x:dx,y:dy};
let ps=null;
stage.addEventListener('pointerdown',e=>{
if(state!=='play'||e.target.closest('a,button'))return;
ps={x:e.clientX,y:e.clientY,done:false}});
stage.addEventListener('pointermove',e=>{
if(!ps||ps.done)return;
const d=mapD(e.clientX-ps.x,e.clientY-ps.y);
if(Math.abs(d.y)>38&&Math.abs(d.y)>Math.abs(d.x)){ps.done=true;d.y>0?slide():jump()}});
stage.addEventListener('pointerup',e=>{
if(ps&&!ps.done){const d=mapD(e.clientX-ps.x,e.clientY-ps.y);if(Math.hypot(d.x,d.y)<22)jump()}
ps=null});
stage.addEventListener('pointercancel',()=>{ps=null});
addEventListener('keydown',e=>{
if(['ArrowUp','ArrowDown',' ','w','s'].includes(e.key)){e.preventDefault()}
if(state==='menu'&&(e.key==='Enter'||e.key===' '))return;
if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();
if(e.key==='ArrowDown'||e.key==='s')slide()});
$('#play').onclick=()=>{tryLandscape();startRun()};
$('#again').onclick=()=>{if(performance.now()-overAt>500)startRun()};
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l});
function menuInfo(){$('#mBest').textContent='Best: '+D.best+' m';$('#mCoins').textContent='🪙 '+D.coins}
let tab='chars',from='menu';
function openShop(f){
from=f;
$('#menu').hidden=true;$('#over').hidden=true;$('#shop').hidden=false;
$('#sfb').textContent='Pick a character, hat, cape or color';
renderShop()}
function closeShop(){
$('#shop').hidden=true;
if(from==='over')$('#over').hidden=false;else{$('#menu').hidden=false;menuInfo()}}
$('#openShop').onclick=()=>openShop('menu');
$('#overShop').onclick=()=>openShop('over');
$('#sclose').onclick=closeShop;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
tab=b.dataset.t;renderShop()});
function renderShop(){
$('#wal').textContent='🪙 '+D.coins;
const box=$('#items');
box.innerHTML='';
box.className='items'+(tab==='colors'?' sw':'');
if(tab==='colors'){
COLORS.forEach((c,i)=>{
const b=document.createElement('button');
b.style.background=c;
b.setAttribute('aria-label','Color '+(i+1));
b.setAttribute('aria-pressed',D.color===c);
b.onclick=()=>{D.color=c;save();GA.sfx('tick');renderShop()};
box.append(b)});
return}
const cfg={chars:{list:CHARS,own:'oc',key:'char'},hats:{list:HATS,own:'oh',key:'hat'},capes:{list:CAPES,own:'op',key:'cape'}}[tab];
cfg.list.forEach(it=>{
const own=D[cfg.own].includes(it.id),el=document.createElement('div');
el.className='it'+(D[cfg.key]===it.id?' sel':'')+(own?'':' lock');
const cn=document.createElement('canvas');
cn.width=104;cn.height=128;
const o={char:D.char,color:D.color,hat:D.hat,cape:D.cape,pose:'stand',s:1.7};
o[cfg.key]=it.id;
drawHero(cn.getContext('2d'),52,116,o);
const nm=document.createElement('b');
nm.textContent=it.name;
const bt=document.createElement('button');
if(!own){bt.textContent='Buy 🪙 '+it.price;bt.onclick=()=>buy(cfg,it)}
else if(D[cfg.key]===it.id){bt.textContent='Selected ✓';bt.disabled=true}
else{bt.textContent='Use';bt.onclick=()=>{D[cfg.key]=it.id;save();GA.sfx('tick');$('#sfb').textContent=it.name+' selected';renderShop()}}
el.append(cn,nm,bt);
box.append(el)})}
function buy(cfg,it){
if(D.coins<it.price){GA.sfx('bad');$('#sfb').textContent='Not enough coins. You need '+(it.price-D.coins)+' more 🪙';return}
D.coins-=it.price;D[cfg.own].push(it.id);D[cfg.key]=it.id;save();
GA.sfx('good');
$('#sfb').textContent='You got the '+it.name+'! 🎉';
renderShop()}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,150));
layout();
reset();
menuInfo();
requestAnimationFrame(frame);
GA.init({"root": 196, "scale": [0, 3, 5, 7, 10], "wave": "triangle", "bpm": 138, "gain": 0.07, "pat": "0 2 3 2 4 3 2 _ 4 3 2 3 4 2 0 _"});
</script>
