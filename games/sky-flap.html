<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Flap</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff4ff;--card:#fff;--ink:#0d3b57;--muted:#4f7f99;--accent:#29b6f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1b26;--card:#12303f;--ink:#e0f4ff;--muted:#8fbbd1;--accent:#4fc3f7}}
:root[data-theme="dark"]{--bg:#0a1b26;--card:#12303f;--ink:#e0f4ff;--muted:#8fbbd1;--accent:#4fc3f7}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem}
#fb{text-align:center;font-weight:600;min-height:1.5em}
canvas{width:100%;aspect-ratio:360/480;display:block;border-radius:16px;touch-action:none;background:#4fc3f7;max-height:62vh}
#flap{border:0;background:var(--accent);color:#fff;font:700 1.5rem Fredoka,sans-serif;padding:18px;border-radius:18px;cursor:pointer;touch-action:manipulation}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#0d3b57;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#4f7f99;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🐥☁️</p><h2>Welcome</h2><p class="sub">Let’s play Sky Flap</p></div></div>
<main>
<h1>Sky Flap</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span id="sc">⭐ 0</span><span id="bs">Best: 0</span></div>
<div id="fb" aria-live="polite">Tap to start, tap to flap!</div>
<canvas id="c" width="360" height="480"></canvas>
<button id="flap">⬆ Flap</button>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d'),W=360,H=480,GY=420,BX=90,PW=58;
const LV={easy:{gap:190,v:115},medium:{gap:162,v:145},hard:{gap:138,v:175}};
let level='easy',state='ready',score=0,best=0,bird,pipes,t=0,last=0,gx=0,overAt=0;
const clouds=[{x:40,y:70,s:1},{x:230,y:135,s:.8},{x:340,y:48,s:1.1}];
try{best=+localStorage.getItem('flapBest')||0}catch(e){}
const R=(a,b)=>a+Math.random()*(b-a);
function ui(){
$('#sc').textContent='⭐ '+score;
$('#bs').textContent='Best: '+best}
function reset(){
bird={y:H/2-20,vy:0};
pipes=[];score=0;state='ready';
ui()}
function flap(){
if(state==='over'){
if(performance.now()-overAt<600)return;
reset();state='play'}
if(state==='ready')state='play';
$('#fb').textContent='';
bird.vy=-430;
GA.sfx('jump')}
function addPipe(){pipes.push({x:W+20,gy:R(90,GY-LV[level].gap-60),passed:false})}
function crash(){
state='over';overAt=performance.now();
GA.sfx('lose');
if(score>best){
best=score;
try{localStorage.setItem('flapBest',best)}catch(e){}}
ui();
$('#fb').textContent='Oops! Tap to try again 💪'}
function update(dt){
t+=dt;
if(state!=='over')gx+=(state==='play'?LV[level].v:40)*dt;
clouds.forEach(c=>{c.x-=10*dt;if(c.x<-70)c.x=W+70});
if(state==='ready'){bird.y=H/2-20+Math.sin(t*4)*8;return}
if(state!=='play')return;
const c=LV[level],r=14;
bird.vy+=1500*dt;
bird.y+=bird.vy*dt;
if(bird.y<r){bird.y=r;bird.vy=0}
if(!pipes.length||pipes[pipes.length-1].x<W-210)addPipe();
pipes.forEach(p=>{
p.x-=c.v*dt;
if(!p.passed&&p.x+PW<BX-r){p.passed=true;score++;GA.sfx('good');ui()}});
pipes=pipes.filter(p=>p.x>-PW-10);
if(bird.y+r>=GY)return crash();
for(const p of pipes)if(BX+r>p.x&&BX-r<p.x+PW&&(bird.y-r<p.gy||bird.y+r>p.gy+c.gap))return crash()}
function cloud(c){
g.fillStyle='rgba(255,255,255,.9)';
[[-22,4,18],[0,-6,24],[24,4,18]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(c.x+dx*c.s,c.y+dy*c.s,r*c.s,0,7);g.fill()})}
function pipe(x,y,w,h,capY){
g.fillStyle='#4caf50';g.fillRect(x,y,w,h);
g.fillStyle='#81c784';g.fillRect(x+6,y,8,h);
g.fillStyle='#2e7d32';g.fillRect(x+w-8,y,8,h);
g.fillStyle='#43a047';g.fillRect(x-4,capY,w+8,22);
g.strokeStyle='#1b5e20';g.lineWidth=3;
g.strokeRect(x,y,w,h);g.strokeRect(x-4,capY,w+8,22)}
function drawBird(){
g.save();
g.translate(BX,bird.y);
g.rotate(Math.max(-.5,Math.min(1.1,bird.vy/600)));
g.fillStyle='#ffd93d';g.strokeStyle='#e0a800';g.lineWidth=3;
g.beginPath();g.arc(0,0,15,0,7);g.fill();g.stroke();
g.fillStyle='#fff3b0';g.beginPath();g.ellipse(2,6,9,6,0,0,7);g.fill();
g.fillStyle='#ffb300';g.beginPath();g.ellipse(-5,3+Math.sin(t*20)*2,9,5,-.4,0,7);g.fill();
g.fillStyle='#fff';g.beginPath();g.arc(7,-5,5.5,0,7);g.fill();
g.fillStyle='#111';g.beginPath();g.arc(9,-5,2.6,0,7);g.fill();
g.fillStyle='#ff7043';g.beginPath();g.moveTo(13,-1);g.lineTo(25,3);g.lineTo(13,8);g.closePath();g.fill();
g.restore()}
function draw(){
const sky=g.createLinearGradient(0,0,0,GY);
sky.addColorStop(0,'#4fc3f7');sky.addColorStop(1,'#e1f5fe');
g.fillStyle=sky;g.fillRect(0,0,W,H);
clouds.forEach(cloud);
const gap=LV[level].gap;
pipes.forEach(p=>{pipe(p.x,0,PW,p.gy-22,p.gy-22);pipe(p.x,p.gy+gap+22,PW,GY-(p.gy+gap+22),p.gy+gap)});
g.fillStyle='#d9b26a';g.fillRect(0,GY,W,H-GY);
g.fillStyle='#7cb342';g.fillRect(0,GY,W,12);
g.fillStyle='#c79a52';
for(let i=-1;i<14;i++)g.fillRect(i*30-(gx%30),GY+24,14,6);
drawBird();
g.textAlign='center';g.lineJoin='round';
g.font='700 52px Fredoka,Arial,sans-serif';
g.strokeStyle='#0d3b57';g.lineWidth=7;g.strokeText(score,W/2,80);
g.fillStyle='#fff';g.fillText(score,W/2,80);
if(state==='ready'){
g.font='700 26px Fredoka,Arial,sans-serif';
g.strokeText('Tap to fly!',W/2,H/2+70);
g.fillText('Tap to fly!',W/2,H/2+70)}
if(state==='over'){
g.font='700 34px Fredoka,Arial,sans-serif';
g.strokeText('Oops!',W/2,H/2-10);g.fillText('Oops!',W/2,H/2-10);
g.font='700 22px Fredoka,Arial,sans-serif';
g.strokeText('Tap to try again',W/2,H/2+28);g.fillText('Tap to try again',W/2,H/2+28)}}
function frame(ts){
const dt=Math.min((ts-last)/1000,.05);
last=ts;
update(dt);
draw();
requestAnimationFrame(frame)}
cv.addEventListener('pointerdown',flap);
$('#flap').addEventListener('pointerdown',flap);
addEventListener('keydown',e=>{
if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();flap()}});
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
reset();
$('#fb').textContent='Tap to start, tap to flap!'});
reset();
requestAnimationFrame(frame);
GA.init({"root": 349.23, "scale": [0, 2, 4, 7, 9], "wave": "triangle", "bpm": 112, "gain": 0.09, "pat": "0 2 4 2 3 1 2 0 4 5 4 2 3 2 1 _"});
</script>
</body>
</html>
