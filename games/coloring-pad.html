<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coloring Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e8ff;--card:#fff;--ink:#3b1f5c;--muted:#7a5d9c;--accent:#8e5be8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1026;--card:#2a1b3d;--ink:#f1e6ff;--muted:#b9a0d9;--accent:#b18cff}}
:root[data-theme="dark"]{--bg:#1a1026;--card:#2a1b3d;--ink:#f1e6ff;--muted:#b9a0d9;--accent:#b18cff}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.seg{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:9px 2px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
canvas{width:100%;aspect-ratio:1;display:block;border-radius:16px;background:#fff;touch-action:none;border:3px solid var(--ink)}
.pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pal button{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line,#00000033);cursor:pointer;padding:0}
.pal button[aria-pressed="true"]{outline:4px solid var(--accent);outline-offset:2px}
.size{display:flex;align-items:center;gap:10px;font-weight:600}
.size input{flex:1;accent-color:var(--accent)}
.row{display:flex;gap:10px}
.row>*{flex:1}
#clear{border:0;background:var(--accent);color:#fff;font:700 1rem Fredoka,sans-serif;padding:12px;border-radius:14px;cursor:pointer}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:10px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#3b1f5c;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#7a5d9c;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🎨🖍️</p><h2>Welcome</h2><p class="sub">Let’s start coloring</p></div></div>
<main>
<h1>Coloring Pad</h1>
<div class="seg" id="tpl">
<button data-t="blank" aria-pressed="true">Blank</button>
<button data-t="star" aria-pressed="false">Star</button>
<button data-t="house" aria-pressed="false">House</button>
<button data-t="fish" aria-pressed="false">Fish</button>
</div>
<canvas id="c" width="360" height="360"></canvas>
<div class="pal" id="pal"></div>
<div class="seg" id="tools">
<button data-k="brush" aria-pressed="true">🖌️ Brush</button>
<button data-k="fill" aria-pressed="false">🪣 Fill</button>
<button data-k="erase" aria-pressed="false">🧽 Eraser</button>
</div>
<label class="size">Size <input type="range" id="size" min="4" max="36" value="12"></label>
<div class="row">
<button id="clear">Start over</button>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</div>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),g=cv.getContext('2d',{willReadFrequently:true}),N=360;
const COLORS=['#e63946','#ff9f1c','#ffd60a','#2fb344','#1d9bf0','#7c4dff','#ff6fb5','#8b5a2b','#111111','#ffffff'];
let color=COLORS[0],tool='brush',tpl='blank',drawing=false,px,py;
function outline(){
g.fillStyle='#fff';g.fillRect(0,0,N,N);
g.strokeStyle='#111';g.lineWidth=5;g.lineJoin='round';g.lineCap='round';
g.beginPath();
if(tpl==='star'){
for(let i=0;i<10;i++){
const r=i%2?60:150,a=-Math.PI/2+i*Math.PI/5;
g[i?'lineTo':'moveTo'](180+r*Math.cos(a),190+r*Math.sin(a))}
g.closePath()}
else if(tpl==='house'){
g.rect(80,170,200,150);
g.moveTo(60,172);g.lineTo(180,70);g.lineTo(300,172);g.closePath();
g.rect(155,235,50,85);
g.rect(100,200,45,40)}
else if(tpl==='fish'){
g.ellipse(160,180,115,75,0,0,Math.PI*2);
g.moveTo(272,180);g.lineTo(340,115);g.lineTo(340,245);g.closePath();
g.moveTo(126,168);g.arc(120,168,8,0,Math.PI*2)}
g.stroke()}
function fill(sx,sy){
const img=g.getImageData(0,0,N,N),d=img.data;
const i0=(sy*N+sx)*4,t=[d[i0],d[i0+1],d[i0+2]];
const f=parseInt(color.slice(1),16),fr=f>>16,fg=f>>8&255,fb=f&255;
if(Math.abs(t[0]-fr)+Math.abs(t[1]-fg)+Math.abs(t[2]-fb)<30)return;
const seen=new Uint8Array(N*N),st=[sx,sy];
while(st.length){
const y=st.pop(),x=st.pop();
if(x<0||y<0||x>=N||y>=N)continue;
const p=y*N+x;
if(seen[p])continue;
seen[p]=1;
const i=p*4;
if(Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])>80)continue;
d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255;
st.push(x+1,y,x-1,y,x,y+1,x,y-1)}
g.putImageData(img,0,0)}
function pos(e){
const r=cv.getBoundingClientRect();
return[(e.clientX-r.left)*N/r.width,(e.clientY-r.top)*N/r.height]}
function stroke(x,y){
g.strokeStyle=tool==='erase'?'#fff':color;
g.lineWidth=+$('#size').value;
g.lineCap='round';
g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();
px=x;py=y}
cv.addEventListener('pointerdown',e=>{
const[x,y]=pos(e);
if(tool==='fill'){GA.sfx('pop');fill(x|0,y|0);return}
drawing=true;px=x;py=y;
cv.setPointerCapture(e.pointerId);
stroke(x+.01,y)});
cv.addEventListener('pointermove',e=>{if(drawing){const[x,y]=pos(e);stroke(x,y)}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
COLORS.forEach((c,i)=>{
const b=document.createElement('button');
b.style.background=c;
b.setAttribute('aria-label','Color '+(i+1));
b.setAttribute('aria-pressed',i===0);
b.onclick=()=>{
GA.sfx('tick');color=c;
if(tool==='erase'){tool='brush';pick('#tools','k','brush')}
document.querySelectorAll('#pal button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('#pal').append(b)});
function pick(sel,key,val){
document.querySelectorAll(sel+' button').forEach(x=>x.setAttribute('aria-pressed',x.dataset[key]===val))}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>{tool=b.dataset.k;pick('#tools','k',tool)});
document.querySelectorAll('#tpl button').forEach(b=>b.onclick=()=>{tpl=b.dataset.t;pick('#tpl','t',tpl);outline()});
$('#clear').onclick=outline;
outline();
GA.init({"root": 220, "scale": [0, 2, 4, 7, 9], "wave": "sine", "bpm": 72, "gain": 0.09, "pat": "0 _ 2 _ 4 _ 2 _ 3 _ 1 _ 0 _ _ _"});
</script>
</body>
</html>
