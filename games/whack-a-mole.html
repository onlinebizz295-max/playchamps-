<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whack-a-Mole</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff3d2;--card:#fff;--ink:#23401a;--muted:#5f7f54;--accent:#4caf50;--board:#8bd47a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c0b;--card:#1a2d14;--ink:#e4f5dc;--muted:#9bbf8f;--accent:#6fcf73;--board:#2f5a27}}
:root[data-theme="dark"]{--bg:#0f1c0b;--card:#1a2d14;--ink:#e4f5dc;--muted:#9bbf8f;--accent:#6fcf73;--board:#2f5a27}
*{box-sizing:border-box}
html{height:100%;color-scheme:light dark}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
h1{font-size:2.2rem;margin:0;text-align:center;line-height:1.1}
.modes{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px}
.modes button{flex:1;border:0;background:none;color:var(--muted);font:600 .95rem Fredoka,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem}
#fb{text-align:center;font-weight:600;font-size:1.15rem;min-height:1.6em}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--board);padding:14px;border-radius:20px}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(#2b1a0c 56%,#5b3a1e 58%);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;padding:0;touch-action:manipulation;font-size:clamp(2.4rem,14vw,3.6rem)}
.hole.up span{animation:rise .15s ease-out}
@keyframes rise{from{transform:translateY(70%)}to{transform:none}}
#exit{text-align:center;text-decoration:none;font:600 1rem Fredoka,sans-serif;padding:11px;border-radius:14px;border:2px solid var(--ink);color:var(--ink)}
button:focus-visible,#exit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#welcome{position:fixed;inset:0;z-index:10;background:#fff;color:#23401a;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;animation:fadeOut 3s ease 1.2s forwards}
#welcome>div{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#welcome .icons{font-size:2.8rem;margin:0}
#welcome h2{font-size:2.8rem;margin:0}
#welcome .sub{margin:6px 0 0;color:#5f7f54;font-weight:600}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#welcome>div,.hole.up span{animation:none}}
</style>
</head>
<body>
<div id="welcome"><div><p class="icons">🐹🔨</p><h2>Welcome</h2><p class="sub">Let’s play Whack-a-Mole</p></div></div>
<main>
<h1>Whack-a-Mole</h1>
<div class="modes" id="modes">
<button data-l="easy" aria-pressed="true">Easy</button>
<button data-l="medium" aria-pressed="false">Medium</button>
<button data-l="hard" aria-pressed="false">Hard</button>
</div>
<div class="bar"><span>Tap the moles!</span><span id="sc">⭐ 0</span></div>
<div id="fb" aria-live="polite"></div>
<div id="board"></div>
<a id="exit" href="../index.html?exit=1#dashboard" target="_top">Exit</a>
</main>
<script src="../exit.js"></script>
<script src="../sound.js"></script>
<script>window.GA=window.GA||{init(){},sfx(){}}</script>
<script>
const $=s=>document.querySelector(s);
const dur={easy:1600,medium:1100,hard:750};
let level='easy',score=0,cur=-1,last=-1,timer;
const holes=[];
for(let i=0;i<9;i++){
const h=document.createElement('button');
h.className='hole';
h.setAttribute('aria-label','Hole '+(i+1));
h.innerHTML='<span></span>';
h.addEventListener('pointerdown',()=>whack(i));
holes.push(h);
$('#board').append(h)}
const show=(n,t)=>holes[n].firstChild.textContent=t;
function hide(){
if(cur>=0){holes[cur].classList.remove('up');show(cur,'')}
cur=-1}
function pop(){
hide();
let n;
do n=Math.random()*9|0;while(n===last);
last=cur=n;
holes[n].classList.add('up');
show(n,'🐹');
timer=setTimeout(()=>{hide();timer=setTimeout(pop,450)},dur[level])}
function whack(i){
if(i!==cur){GA.sfx('tick');return}
GA.sfx('hit');
clearTimeout(timer);
score++;
$('#sc').textContent='⭐ '+score;
$('#fb').textContent=['Bonk! 🎉','Got it! ⭐','Nice one! 👏'][Math.random()*3|0];
holes[i].classList.remove('up');
show(i,'💥');
cur=-1;
timer=setTimeout(()=>{show(i,'');pop()},500)}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
level=b.dataset.l;
clearTimeout(timer);
holes.forEach((h,i)=>{h.classList.remove('up');show(i,'')});
cur=-1;score=0;
$('#sc').textContent='⭐ 0';
$('#fb').textContent='';
timer=setTimeout(pop,600)});
timer=setTimeout(pop,800);
GA.init({"root": 233.08, "scale": [0, 2, 4, 7, 9], "wave": "sawtooth", "bpm": 150, "gain": 0.05, "pat": "0 3 0 4 2 5 2 4 0 3 0 4 5 4 2 _"});
</script>
</body>
</html>
